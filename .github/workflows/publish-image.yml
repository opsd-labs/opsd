name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: opsd-labs

jobs:
  publish:
    name: 构建并发布 ${{ matrix.image }} 镜像
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hub
            image: opsd
            title: opsd Hub 管理系统
          - target: agent
            image: opsd-agent
            title: opsd Agent Docker 运行镜像
    steps:
      - uses: actions/checkout@v4
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main-${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_started_at }}
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: 拉取已发布镜像并记录摘要
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker pull "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -Fx "$GITHUB_SHA"
      - name: Hub smoke test
        if: matrix.target == 'hub'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          name="opsd-publish-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; sudo rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/data"
          printf 'ci-password-%s\n' "$GITHUB_RUN_ID" > "$tmp/password"
          image="ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker run --rm --read-only -v "$tmp/data:/var/lib/opsd" -v "$tmp/password:/run/password:ro" "$image" init --password-file /run/password > "$tmp/init.log"
          docker run -d --name "$name" -v "$tmp/data:/var/lib/opsd" --tmpfs /tmp:size=32m,mode=1777 -p 127.0.0.1:36535:65535 "$image" serve --listen 0.0.0.0:65535 --agent-listen 0.0.0.0:8444 --health-listen 127.0.0.1:65534 --web /opt/opsd/web
          for _ in {1..30}; do docker exec "$name" /usr/local/bin/opsd-hub probe && break; sleep 2; done
          docker exec "$name" /usr/local/bin/opsd-hub probe
          entrance=$(sed -n 's/^控制台安全入口：//p' "$tmp/init.log")
          test -n "$entrance"
          curl -kfsS "https://127.0.0.1:36535/$entrance/" | grep -Eq '<!doctype html|<html'
      - name: Agent smoke test
        if: matrix.target == 'agent'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker run --rm "$image" --help | grep -q 'Usage'
          test -n "$(docker run --rm --entrypoint /bin/sh "$image" -c 'command -v /usr/local/bin/opsd-agent && test -x /usr/local/bin/opsd-agent && echo ok')"
