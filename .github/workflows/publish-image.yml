name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opsd-labs/opsd

jobs:
  publish:
    name: 构建并发布 GHCR 镜像
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=opsd
            org.opencontainers.image.description=opsd Hub 与 Agent 管理系统
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main-${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_started_at }}
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 拉取已发布镜像
        run: docker pull ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}
      - name: 运行 Hub、健康监听和 Web smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          name="opsd-publish-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/data"
          printf 'ci-password-%s\n' "$GITHUB_RUN_ID" > "$tmp/password"
          docker run --rm --read-only \
            -v "$tmp/data:/var/lib/opsd" \
            -v "$tmp/password:/run/password:ro" \
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} \
            init --password-file /run/password > "$tmp/init.log"
          docker run -d --name "$name" \
            -v "$tmp/data:/var/lib/opsd" \
            -p 127.0.0.1::65535 \
            -p 127.0.0.1::65534 \
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} \
            serve --listen 0.0.0.0:65535 --agent-listen 0.0.0.0:8444 --health-listen 0.0.0.0:65534 --web /opt/opsd/web
          for _ in {1..30}; do
            health_port=$(docker port "$name" 65534/tcp | sed 's/.*://')
            curl -fsS "http://127.0.0.1:${health_port}/api/v1/health" && break
            sleep 2
          done
          docker exec "$name" /usr/local/bin/opsd-hub probe
          console_port=$(docker port "$name" 65535/tcp | sed 's/.*://')
          entrance=$(sed -n 's/^控制台安全入口：//p' "$tmp/init.log")
          test -n "$entrance"
          curl -kfsS "https://127.0.0.1:${console_port}/${entrance}/" | grep -q '<!doctype html\|<html'
      - name: 验证镜像元数据和摘要
        run: |
          set -euo pipefail
          docker image inspect ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} --format '{{index .RepoDigests 0}}'
          docker image inspect ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -Fx "$GITHUB_SHA"
