name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume_installation_run:
        description: 仅验收脚本修正时，复用此运行的成功制品并只重跑未通过安装组合
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: publish-image-main
  cancel-in-progress: false

env:
  OWNER: opsd-labs

jobs:
  agent:
    name: 构建 Agent ${{ matrix.arch }}
    if: ${{ inputs.resume_installation_run == '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: 准备 musl 工具链
        run: |
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
      - name: 构建原生架构程序与发行包
        env:
          CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bins
          mkdir -p .release
          cp target/${{ matrix.target }}/release/opsd-agent .release/opsd-agent
          cp target/${{ matrix.target }}/release/opsd-hub .release/opsd-hub
          tar -C .release -czf .release/opsd-agent-linux-${{ matrix.arch }}.tar.gz opsd-agent
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 使用同一程序构建并发布 Agent 镜像
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/opsd-agent:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            AGENT_BINARY_STAGE=prebuilt-agent-binary
            VCS_REF=${{ github.sha }}
            VERSION=agent-${{ github.sha }}
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.arch }}
      - name: 保存本次发布引用
        run: printf '%s\n' 'ghcr.io/${{ env.OWNER }}/opsd-agent@${{ steps.image.outputs.digest }}' > .release/agent-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            .release/opsd-agent-linux-${{ matrix.arch }}.tar.gz
            .release/opsd-hub
            .release/agent-image.txt

  release:
    name: 发布 Agent 双架构索引与固定发行包
    if: ${{ inputs.resume_installation_run == '' }}
    needs: agent
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-release-*
          path: .release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布固定镜像索引
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ env.OWNER }}/opsd-agent:sha-${GITHUB_SHA}"
          docker buildx imagetools create --tag "$image" "$(cat .release/agent-release-amd64/agent-image.txt)" "$(cat .release/agent-release-arm64/agent-image.txt)"
          digest=$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          echo "image=ghcr.io/${{ env.OWNER }}/opsd-agent@$digest" >> "$GITHUB_OUTPUT"
          echo "release=agent-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: 发布待安装验收的发行文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release="agent-${GITHUB_SHA}"
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --prerelease --target "$GITHUB_SHA" --title "Agent ${GITHUB_SHA::12}" --notes "固定提交的 Linux x64 与 ARM64 安装包；安装验收通过后才能用于灰度更新。"
          fi
          assets=$(gh release view "$release" --json assets --jq '.assets[].name')
          for arch in amd64 arm64; do
            name="opsd-agent-linux-$arch.tar.gz"
            if ! printf '%s\n' "$assets" | grep -Fxq "$name"; then
              gh release upload "$release" ".release/agent-release-$arch/$name"
            fi
          done

  hub:
    name: 发布绑定 Agent 版本的 Hub
    if: ${{ inputs.resume_installation_run == '' }}
    needs: release
    runs-on: ubuntu-24.04
    outputs:
      image: ghcr.io/opsd-labs/opsd@${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并发布 Hub
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hub
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/opsd:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
            AGENT_RELEASE=${{ needs.release.outputs.release }}
            AGENT_IMAGE=${{ needs.release.outputs.image }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
      - name: 已发布 Hub 的原有启动验收
        env:
          IMAGE: ghcr.io/opsd-labs/opsd@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          name="opsd-publish-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; sudo rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/data"
          printf 'ci-password-%s\n' "$GITHUB_RUN_ID" > "$tmp/password"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -Fx "$GITHUB_SHA"
          docker run --rm --read-only -v "$tmp/data:/var/lib/opsd" -v "$tmp/password:/run/password:ro" "$IMAGE" init --password-file /run/password > "$tmp/init.log"
          docker run -d --name "$name" -v "$tmp/data:/var/lib/opsd" --tmpfs /tmp:size=32m,mode=1777 -p 127.0.0.1:36535:65535 "$IMAGE" serve --listen 0.0.0.0:65535 --agent-listen 0.0.0.0:8444 --health-listen 127.0.0.1:65534 --web /opt/opsd/web
          for _ in {1..30}; do docker exec "$name" /usr/local/bin/opsd-hub probe && break; sleep 2; done
          docker exec "$name" /usr/local/bin/opsd-hub probe
          entrance=$(sed -n 's/^控制台安全入口：//p' "$tmp/init.log")
          test -n "$entrance"
          docker cp "$name:/var/lib/opsd/pki/ca.pem" "$tmp/ca.pem"
          curl --cacert "$tmp/ca.pem" -fsS "https://127.0.0.1:36535/$entrance/" | grep -Eq '<!doctype html|<html'

  installation-inputs:
    name: 取得本批安装制品与未通过范围
    needs: [release, hub]
    if: ${{ always() && !cancelled() && (inputs.resume_installation_run != '' || (needs.release.result == 'success' && needs.hub.result == 'success')) }}
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      agent: ${{ steps.metadata.outputs.agent }}
      hub: ${{ steps.metadata.outputs.hub }}
      run: ${{ steps.metadata.outputs.run }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - name: 复用成功制品的来源与失败范围
        if: ${{ inputs.resume_installation_run != '' }}
        id: prior
        uses: actions/github-script@v7
        env:
          PRIOR_RUN: ${{ inputs.resume_installation_run }}
        with:
          script: |
            const runId = Number(process.env.PRIOR_RUN);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: runId, per_page: 100});
            const producers = ['构建 Agent amd64', '构建 Agent arm64', '发布 Agent 双架构索引与固定发行包', '发布绑定 Agent 版本的 Hub'];
            if (run.status !== 'completed' || producers.some(name => !jobs.some(job => job.name === name && job.conclusion === 'success'))) {
              throw new Error('原运行的双架构制品与 Hub 尚未全部成功，不能复用。');
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead: `${run.head_sha}...${context.sha}`});
            const allowed = new Set(['tests/share-e2e.mjs', '.github/workflows/publish-image.yml']);
            const documentation = name => name === 'README.md' || (name.startsWith('docs/') && name.endsWith('.md'));
            if (comparison.files.some(file => !allowed.has(file.filename) && !documentation(file.filename))) {
              throw new Error('业务源码、依赖或其他输入已变化，不能只复用上一批安装制品。');
            }
            const cases = jobs.filter(job => /^一键安装 (amd64|arm64) \/ (host|docker)$/.test(job.name));
            if (cases.length !== 4) throw new Error('原运行不是完整的四组合安装验收。');
            const include = cases.filter(job => job.conclusion !== 'success').map(job => {
              const [, arch, mode] = job.name.match(/^一键安装 (amd64|arm64) \/ (host|docker)$/);
              return {arch, mode, runner: arch === 'arm64' ? 'ubuntu-24.04-arm' : 'ubuntu-24.04'};
            });
            if (!include.length) throw new Error('全部安装组合已经成功，无需重复验收。');
            core.setOutput('revision', run.head_sha);
            core.setOutput('run', runId);
            core.setOutput('matrix', JSON.stringify({include}));
      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.resume_installation_run != '' }}
      - uses: docker/login-action@v3
        if: ${{ inputs.resume_installation_run != '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 使用固定制品引用
        id: metadata
        env:
          PRIOR_REVISION: ${{ steps.prior.outputs.revision }}
          PRIOR_RUN: ${{ steps.prior.outputs.run }}
          PRIOR_MATRIX: ${{ steps.prior.outputs.matrix }}
          CURRENT_RELEASE: ${{ needs.release.outputs.release }}
          CURRENT_AGENT: ${{ needs.release.outputs.image }}
          CURRENT_HUB: ${{ needs.hub.outputs.image }}
        run: |
          set -euo pipefail
          if [ -n "$PRIOR_RUN" ]; then
            for kind in agent hub; do
              image=opsd
              if [ "$kind" = agent ]; then image=opsd-agent; fi
              digest=$(docker buildx imagetools inspect "ghcr.io/${{ env.OWNER }}/$image:sha-$PRIOR_REVISION" | awk '/^Digest:/ {print $2; exit}')
              test -n "$digest"
              echo "$kind=ghcr.io/${{ env.OWNER }}/$image@$digest" >> "$GITHUB_OUTPUT"
            done
            echo "release=agent-$PRIOR_REVISION" >> "$GITHUB_OUTPUT"
            echo "run=$PRIOR_RUN" >> "$GITHUB_OUTPUT"
            echo "matrix=$PRIOR_MATRIX" >> "$GITHUB_OUTPUT"
          else
            echo "release=$CURRENT_RELEASE" >> "$GITHUB_OUTPUT"
            echo "agent=$CURRENT_AGENT" >> "$GITHUB_OUTPUT"
            echo "hub=$CURRENT_HUB" >> "$GITHUB_OUTPUT"
            echo "run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-24.04","mode":"host"},{"arch":"amd64","runner":"ubuntu-24.04","mode":"docker"},{"arch":"arm64","runner":"ubuntu-24.04-arm","mode":"host"},{"arch":"arm64","runner":"ubuntu-24.04-arm","mode":"docker"}]}' >> "$GITHUB_OUTPUT"
          fi

  installation:
    name: 一键安装 ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: installation-inputs
    if: ${{ always() && !cancelled() && needs.installation-inputs.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.installation-inputs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/download-artifact@v4
        with:
          name: agent-release-${{ matrix.arch }}
          path: .release
          run-id: ${{ needs.installation-inputs.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 读取本次 Hub 页面与原生架构主控
        env:
          IMAGE: ${{ needs.installation-inputs.outputs.hub }}
        run: |
          set -euo pipefail
          chmod +x .release/opsd-hub
          mkdir -p web
          container=$(docker create --platform linux/amd64 "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/opt/opsd/web" web/dist
      - name: 安装现有浏览器验收依赖
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 执行页面原样命令与安装恢复验收
        env:
          OPSD_TEST_BIN_DIR: ${{ github.workspace }}/.release
          OPSD_INSTALL_ACCEPTANCE: ${{ matrix.mode }}
          OPSD_AGENT_RELEASE: ${{ needs.installation-inputs.outputs.release }}
          OPSD_BUNDLED_AGENT_IMAGE: ${{ needs.installation-inputs.outputs.agent }}
        run: node tests/share-e2e.mjs

  complete:
    name: 安装验收完成后更新正式引用
    needs: [installation-inputs, installation]
    if: ${{ always() && !cancelled() && needs.installation-inputs.result == 'success' && needs.installation.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 记录已通过安装验收的固定制品
        run: |
          printf '%s\n' 'Hub：${{ needs.installation-inputs.outputs.hub }}' 'Agent：${{ needs.installation-inputs.outputs.agent }}' '发行版：${{ needs.installation-inputs.outputs.release }}' '制品来源：${{ needs.installation-inputs.outputs.run }}'
      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 更新 main 与 latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx imagetools create --tag ghcr.io/${{ env.OWNER }}/opsd:main --tag ghcr.io/${{ env.OWNER }}/opsd:latest '${{ needs.installation-inputs.outputs.hub }}'
          docker buildx imagetools create --tag ghcr.io/${{ env.OWNER }}/opsd-agent:main --tag ghcr.io/${{ env.OWNER }}/opsd-agent:latest '${{ needs.installation-inputs.outputs.agent }}'
          gh release edit '${{ needs.installation-inputs.outputs.release }}' --prerelease=false

