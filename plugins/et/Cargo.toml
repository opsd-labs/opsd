[package]
name = "opsd-plugin-et"
version = "0.1.0"
edition = "2024"

[dependencies]
opsd-plugin-sdk = { path = "../sdk" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
ipnet = "2"

