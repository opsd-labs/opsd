[package]
name = "opsd-plugin-silo"
version = "0.1.0"
edition = "2024"

[dependencies]
opsd = { path = "../.." }
opsd-plugin-sdk = { path = "../sdk" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ipnet = "2"

