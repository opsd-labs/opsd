      description: >
        只读磁盘文件，返回 assets 目录下的静态文件二进制，Content-Type 依扩展名：

        js→text/javascript、css→text/css、svg→image/svg+xml、json→application/json、woff2→font/woff2、其他→application/octet-stream。

        不设置缓存响应头；响应体是构建产物原文，绝不包含令牌、凭据或服务端路径信息。
      servers:
        - url: https://{host}
          description: 主控 HTTPS 监听地址
          variables:
            host:
              default: localhost:65535
              description: 主控 HTTPS 监听地址
      security: []
      responses:
        "200":
          description: 文件二进制，Content-Type 依扩展名而定（见操作描述）。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: |
            空正文（无 JSON、无文本）：path 包含 ".." 或以 / 开头（防目录穿越），或目标文件读取失败。
