      description: Agent mTLS 面（独立监听、要求客户端证书），不属于浏览器接口。身份由证书解析，不改节点状态、不产生任务。
      servers:
        - url: https://{host}
          description: Agent mTLS 监听地址，要求客户端证书。
          variables:
            host:
              default: 0.0.0.0:8444
              description: Agent mTLS 监听地址，默认 0.0.0.0:8444（--agent-listen 可改）
      security:
        - agentMtls: []
      requestBody:
        required: true
        content:
