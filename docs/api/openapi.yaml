                    description: 时钟偏移告警阈值（秒），固定 60；偏移超过它提示管理员。
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetricsOverviewNode"
                    description: 所有已上报节点的最近成功采样与当前采集状态。
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/metrics/status:
