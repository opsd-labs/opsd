          type: integer
          format: int64
          description: 扣除校验后的可用容量。
        parity_note:
          type: string
          description: 校验说明，例如「共 N 块盘，校验 P 块；容量按最小盘 X 计算」。
      additionalProperties: false
    Report:
      type: object
      required:
        - generated_at
        - nodes
        - checks
        - ready
        - summary
      properties:
        generated_at:
          type: integer
          format: int64
          description: 报告生成时间（unix 秒）。
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/StorageNodeVerdict"
          description: 逐节点结论。
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
          description: 一致性检查项。
        topology:
          oneOf:
            - $ref: "#/components/schemas/Topology"
            - type: "null"
          description: 推荐拓扑；条件不满足时为 null。
        ready:
          type: boolean
          description: 总体是否可直接进入部署计划。
        summary:
          type: string
          description: 面向运维的总结说明。
      additionalProperties: false
    ClusterSpec:
      type: object
      required:
        - name
        - nodes
        - image_tag
        - endpoint
        - access_key
        - secret_key
      properties:
        name:
          type: string
          description: 集群名称，1-40 字符，仅字母、数字、连字符与下划线。
        nodes:
          type: array
          items:
            type: string
          description: 参与集群的节点编号，至少 4 个且不重复。
        image_tag:
          type: string
          description: 固定 release 标签，不接受 latest；应形如 RELEASE.<时间戳> 或以数字开头，最长 80。
        endpoint:
          type: string
          description: 对外服务地址，非空，用于生成分布式拓扑。
        access_key:
          type: string
          description: 访问键名，至少 3 字符。
        secret_key:
          type: string
          description: 访问键密钥，非空且至少 16 字符。
        created_at:
          type: integer
          format: int64
          description: 由服务端填写：新建时设为当前时间，已存在则保留旧值；客户端可不传。
      additionalProperties: false
    ClusterListItem:
      type: object
      required:
        - name
        - nodes
        - image_tag
        - endpoint
        - access_key
        - has_secret_key
      properties:
        name:
          type: string
          description: 集群名称。
        nodes:
          type: array
          items:
            type: string
          description: 参与集群的节点编号。
        image_tag:
          type: string
          description: 固定 release 标签。
        endpoint:
          type: string
          description: 对外服务地址。
        access_key:
          type: string
          description: 访问键名。
        has_secret_key:
          type: boolean
          description: 密钥是否已设置（secret_key 非空时为 true）；secret_key 一律不回传。
        created_at:
          type: integer
          format: int64
          description: 服务端填写的创建时间。
      additionalProperties: false
    PlannedNode:
      type: object
      required:
        - node_id
        - name
        - devices
        - mounts
      properties:
        node_id:
          type: string
          description: 节点编号。
        name:
          type: string
          description: 节点名。
        devices:
          type: array
          items:
            $ref: "#/components/schemas/StorageDeviceTarget"
          description: 即将被清空的设备及计划时的容量。
        mounts:
          type: array
          items:
            type: string
          description: 该节点执行完成后对外提供的挂载点。
      additionalProperties: false
    Plan:
      type: object
      description: 存储部署计划，同时是「将要发生什么」的说明和执行的凭据。
      required:
        - id
        - cluster
        - created_at
        - expires
        - fingerprint
        - nodes
        - image
        - destructive
        - irreversible_notice
      properties:
        id:
          type: string
          description: 计划 id。
        cluster:
          type: string
          description: 集群名。
        created_at:
          type: integer
          format: int64
          description: 计划创建时间（unix 秒）。
        expires:
          type: integer
          format: int64
          description: 有效期（unix 秒），生成时 = now()+300（5 分钟）；过期计划不能执行。
        fingerprint:
          type: string
          description: 预检指纹，候选集合变化即失效，必须重新生成计划。
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/PlannedNode"
          description: 计划内各节点步骤。
        image:
          type: string
          description: 镜像引用，形如 pgsty/silo:<image_tag>。
        destructive:
          type: boolean
          description: 是否包含不可逆步骤（本模块恒为 true）。
        irreversible_notice:
          type: string
          description: 不可逆步骤告知，界面必须原文展示。
        completed:
          type: array
          items:
            type: string
          description: 已执行完成的节点 id 列表，缺省空数组。
        failed:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
          description: 失败节点与原因，元素为 [node_id, reason] 二元数组；非空即视为计划失败，阻断后续节点。缺省空数组。
      additionalProperties: false
    DispatchRecord:
      type: object
      required:
        - node
        - step
        - task_id
      properties:
        node:
          type: string
          description: 节点名。
        step:
          type: string
          enum:
            - 磁盘准备
            - 容器部署
          description: 步骤名：先准备磁盘，成功后再部署容器。
        task_id:
          type: string
          description: 该步骤对应任务 id，可在任务面板追溯。
      additionalProperties: false
    StorageTaskAccepted:
      type: object
      required:
        - task_id
        - node
        - label
      properties:
        task_id:
          type: string
          description: 下发给集群节点的任务 id。
        node:
          type: string
          description: 被选中执行任务的节点。
        label:
          type: string
          description: 动作标签，由各操作固定：状态 / 桶 / 用户。
      additionalProperties: false
    HostInspectRequest:
      type: object
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
          description: 幂等键，用于去重同一个盘点动作；同节点同键不同参数返回 400。
      additionalProperties: false
    ClusterRefRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 集群定义名称。
      additionalProperties: false
    StoragePlanApplyRequest:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: string
          description: 要执行的计划 id。
        acknowledge_destructive:
          type: boolean
          default: false
          description: 破坏性确认字段（名称逐字为 acknowledge_destructive）；计划为破坏性时必须显式 true 才能执行，缺省 false 即拒绝。
      additionalProperties: false
    StoragePlanApplyResult:
      type: object
      required:
        - plan_id
        - dispatched
        - completed
      properties:
        plan_id:
          type: string
          description: 本次执行的计划 id。
        dispatched:
          type: array
          items:
            $ref: "#/components/schemas/DispatchRecord"
          description: 每个节点每个已下发步骤的记录。
        completed:
          type: array
          items:
            type: string
          description: 已完整执行完成的节点 id 列表。
      additionalProperties: false
    BucketRequest:
      type: object
      required:
        - cluster
        - bucket
      properties:
        cluster:
          type: string
          description: 集群定义名称。
        bucket:
          type: string
          description: 桶名。
        remove:
          type: boolean
          default: false
          description: true 时删除桶而非创建，缺省 false。
      additionalProperties: false
    UserRequest:
      type: object
      required:
        - cluster
        - user
        - secret
      properties:
        cluster:
          type: string
          description: 集群定义名称。
        user:
          type: string
          description: 访问用户名。
        secret:
          type: string
          description: 用户密钥。
        policy:
          type: string
          default: readwrite
          description: 策略名，缺省 readwrite。
        remove:
          type: boolean
          default: false
          description: true 时删除用户，缺省 false。
      additionalProperties: false
    Overview:
      type: object
      required:
        - generated_at
        - nodes
        - checks
        - summary
        - expected_cluster_size
        - tone
        - unknown_count
      properties:
        generated_at:
          type: integer
          format: int64
          description: 本视图生成时刻(Unix 秒)。
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseNodeVerdict"
          description: 各节点结论,按名称排序,不含已撤销节点。
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
          description: 跨节点一致性检查结论(集群 UUID 不一致、节点 UUID 重复、成员数不一致、多数派不足、无人按时备份)。
        summary:
          type: string
          description: 一句话总结(已巡检台数、异常数、未知数等),中文。
        expected_cluster_size:
          type: integer
          description: 期望集群成员数,取自各报告 expected_cluster_size 的第一个非 0 值;全部为 0 时此值为 0。
        tone:
          $ref: "#/components/schemas/Tone"
        unknown_count:
          type: integer
          description: 所有节点 unknown 字符串总数,用于一眼看出还有多少没看到。
      additionalProperties: false
    DatabaseNodeVerdict:
      type: object
      required:
        - node_id
        - name
        - online
        - collected_at
        - configured
        - tone
        - findings
        - unknown
        - report
      properties:
        node_id:
          type: string
          description: 节点 ID。
        name:
          type: string
          description: 节点显示名。
        online:
          type: boolean
          description: 节点当前是否在线。
        collected_at:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次巡检时刻(Unix 秒);null 表示从未巡检过,这不是 0。
        configured:
          type: boolean
          description: Agent 本机是否配置了只读巡检账号;只是布尔标记,不含任何凭据本身。
        tone:
          $ref: "#/components/schemas/Tone"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
          description: 已确定的问题列表,可为空数组。
        unknown:
          type: array
          items:
            type: string
          description: 未知项原因列表(尚未巡检/当前离线/未配置账号/某分区采集失败等),中文;界面必须展示,不能只显示 tone。
        report:
          oneOf:
            - $ref: "#/components/schemas/DbInspectReport"
            - type: "null"
          description: 原始巡检报告全文,供界面展开细节;null 表示没有报告。
      additionalProperties: false
    Finding:
      type: object
      required:
        - tone
        - title
        - detail
      properties:
        tone:
          $ref: "#/components/schemas/Tone"
        title:
          type: string
          description: 一句话标题(中文,如「集群成员数与期望不符」)。
        detail:
          type: string
          description: 具体依据(中文,含实际值、期望值与阈值)。
      additionalProperties: false
    Tone:
      type: string
      description: 结论严重程度。只描述已确定的问题:未知不参与排序,无任何发现时为 ok。
      enum:
        - ok
        - warning
        - critical
    DbInspectReport:
      type: object
      description: 原始巡检报告全文。Agent 只带回事实,阈值与比较在控制台完成;不含任何凭据类字段。
      required:
        - collected_at
        - configured
        - galera
        - host
        - proxysql
        - backup
        - gaps
      properties:
        collected_at:
          type: integer
          format: int64
          description: 采集时刻(Unix 秒)。
        configured:
          type: boolean
          description: Agent 本机是否配置了只读巡检账号;未配置时各分区 data 为 null 并带 reason。
        galera:
          $ref: "#/components/schemas/DbSection"
        host:
          $ref: "#/components/schemas/DbSection"
        proxysql:
          $ref: "#/components/schemas/DbSection"
        backup:
          $ref: "#/components/schemas/DbSection"
        gaps:
          type: array
          items:
            type: string
          description: 巡检过程中被跳过的部分与原因,可为空数组。
      additionalProperties: false
    DbSection:
      type: object
      description: |
        分区式采集结果。data 为 null 即该分区未知(连不上/没权限/未配置)——这是「未知不等于 0」
        的表达:不是缺字段、不是 0、不是 "unknown" 枚举,而是 data 为 null 且 reason 给出原因。
      required:
        - data
        - reason
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/GaleraState"
            - $ref: "#/components/schemas/DbHostState"
            - $ref: "#/components/schemas/ProxySqlState"
            - $ref: "#/components/schemas/BackupState"
            - type: "null"
          description: 采集到的事实;null 表示该分区未知,绝不补 0。
        reason:
          type:
            - string
            - "null"
          description: 采集失败或未配置时的具体原因(中文);已知时此值为 null。
      additionalProperties: false
    GaleraState:
      type: object
      description: Galera/wsrep 分区采集到的事实。
      required:
        - cluster_status
        - cluster_size
        - expected_cluster_size
        - local_state
        - local_state_comment
        - ready
        - connected
        - desync
        - flow_control_paused
        - flow_control_paused_ns
        - last_committed
        - recv_queue
        - send_queue
        - cert_failures
        - bf_aborts
        - cluster_state_uuid
        - node_uuid
        - sst_donor
        - provider_version
        - incoming
      properties:
        cluster_status:
          type: string
          description: Primary / non-Primary / Disconnected。
        cluster_size:
          type:
            - integer
            - "null"
          description: 本节点看到的集群成员数;null 表示未知。
        expected_cluster_size:
          type: integer
          description: 期望成员数,来自 Agent 本机巡检配置(默认 5,与告警规则一致);0 表示未知。
        local_state:
          type:
            - integer
            - "null"
          description: wsrep 本地状态码,4 = Synced;null 表示未知。
        local_state_comment:
          type: string
          description: Synced / Donor/Desynced / Joining 等。
        ready:
          type:
            - boolean
            - "null"
          description: wsrep_ready;null 表示未知。
        connected:
          type:
            - boolean
            - "null"
          description: wsrep_connected;null 表示未知。
        desync:
          type:
            - boolean
            - "null"
          description: 是否处于 desync;null 表示未知。
        flow_control_paused:
          type:
            - number
            - "null"
          description: 流控暂停比例(0..1),超过 0.01 阈值才告警,恰好等于不算;null 表示未知。
        flow_control_paused_ns:
          type:
            - integer
            - "null"
          description: 流控暂停纳秒数;null 表示未知。
        last_committed:
          type:
            - integer
            - "null"
          description: 最后提交的事务序号;null 表示未知。
        recv_queue:
          type:
            - integer
            - "null"
          description: 接收队列长度;null 表示未知,不等于 0。告警阈值恒为 32。
        send_queue:
          type:
            - integer
            - "null"
          description: 发送队列长度;null 表示未知,不等于 0。
        cert_failures:
          type:
            - integer
            - "null"
          description: 认证失败累计值;null 表示未知,0 表示无冲突。
        bf_aborts:
          type:
            - integer
            - "null"
          description: BF 中止累计值;null 表示未知。
        cluster_state_uuid:
          type:
            - string
            - "null"
          description: 集群状态 UUID,跨节点一致性判断用;null 表示未知。
        node_uuid:
          type:
            - string
            - "null"
          description: 本节点 UUID,重复即疑似克隆;null 表示未知。
        sst_donor:
          type:
            - string
            - "null"
          description: SST donor;null 表示未知。
        provider_version:
          type:
            - string
            - "null"
          description: wsrep provider 版本;null 表示未知。
        incoming:
          type: array
          items:
            type: string
          description: wsrep_incoming_addresses 拆开后的成员地址,可为空数组。
      additionalProperties: false
    DbHostState:
      type: object
      description: 数据库主机侧分区采集到的事实。
      required:
        - version
        - version_comment
      properties:
        version:
          type: string
          description: 数据库版本字符串。
        version_comment:
          type: string
          description: 版本注释。
        hostname:
          type:
            - string
            - "null"
          description: 主机名;null 表示未知。
        server_id:
          type:
            - integer
            - "null"
          description: server_id;null 表示未知。
        uptime:
          type:
            - integer
            - "null"
          format: int64
          description: 运行秒数;null 表示未知。
        threads_connected:
          type:
            - integer
            - "null"
          description: 已连接线程数;null 表示未知。
        threads_running:
          type:
            - integer
            - "null"
          description: 运行中线程数;null 表示未知。
        read_only:
          type:
            - boolean
            - "null"
          description: read_only 是否 ON;null 为未知。
        binlog_file:
          type:
            - string
            - "null"
          description: binlog 文件名;未开启 binlog 时为 null,这是「没有」不是错误。
        binlog_position:
          type:
            - integer
            - "null"
          description: binlog 位点;null 表示未知。
      additionalProperties: false
    ProxySqlState:
      type: object
      description: ProxySQL 分区采集到的事实。
      required:
        - version
        - uptime
        - writer_online
        - backup_writer_online
        - servers
        - pools
        - digests
      properties:
        version:
          type:
            - string
            - "null"
          description: ProxySQL 版本;null 表示未知。
        uptime:
          type:
            - integer
            - "null"
          format: int64
          description: 运行秒数;null 表示未知。
        writer_online:
          type:
            - integer
            - "null"
          description: writer 组(hostgroup 10)在线后端数;null 为未知,判定阈值恒为 1。
        backup_writer_online:
          type:
            - integer
            - "null"
          description: 备用 writer 组(hostgroup 20)在线后端数;null 为未知,判定下限为 4。
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ProxySqlServer"
          description: 后端节点列表,可为空数组。
        pools:
          type: array
          items:
            $ref: "#/components/schemas/ProxySqlPool"
          description: 连接池计数列表,可为空数组。
        digests:
          type: array
          items:
            $ref: "#/components/schemas/ProxySqlDigest"
          description: 按总耗时排序的前若干条摘要,可为空数组。
      additionalProperties: false
    ProxySqlServer:
      type: object
      required:
        - hostgroup_id
        - hostname
        - port
        - status
        - weight
        - max_connections
        - latency_us
        - queries
        - conn_used
        - conn_free
      properties:
        hostgroup_id:
          type: integer
          description: hostgroup 编号。
        hostname:
          type: string
          description: 后端主机。
        port:
          type: integer
          description: 端口。
        status:
          type: string
          description: ONLINE / SHUNNED / OFFLINE_SOFT 等。
        weight:
          type: integer
          description: 权重。
        max_connections:
          type: integer
          description: 最大连接数。
        latency_us:
          type:
            - integer
            - "null"
          description: 来自 stats_mysql_connection_pool.Latency_us;无该行时为 null,不补 0。
        queries:
          type:
            - integer
            - "null"
          description: 查询数;null 表示未知。
        conn_used:
          type:
            - integer
            - "null"
          description: 已用连接数;null 表示未知。
        conn_free:
          type:
            - integer
            - "null"
          description: 空闲连接数;null 表示未知。
      additionalProperties: false
    ProxySqlPool:
      type: object
      description: 连接池计数行,来自 stats_mysql_connection_pool;各计数 null 表示无该值或未知,不补 0。
      required:
        - hostgroup
        - srv_host
        - srv_port
        - conn_used
        - conn_free
        - conn_ok
        - conn_err
        - queries
        - bytes_sent
        - bytes_recv
        - latency_us
      properties:
        hostgroup:
          type: integer
          description: hostgroup 编号。
        srv_host:
          type: string
          description: 后端主机。
        srv_port:
          type: integer
          description: 端口。
        conn_used:
          type:
            - integer
            - "null"
          description: 已用连接数;null 表示未知。
        conn_free:
          type:
            - integer
            - "null"
          description: 空闲连接数;null 表示未知。
        conn_ok:
          type:
            - integer
            - "null"
          description: 成功连接数;null 表示未知。
        conn_err:
          type:
            - integer
            - "null"
          description: 失败连接数;null 表示未知。
        queries:
          type:
            - integer
            - "null"
          description: 查询数;null 表示未知。
        bytes_sent:
          type:
            - integer
            - "null"
          format: int64
          description: 发送字节数;null 表示未知。
        bytes_recv:
          type:
            - integer
            - "null"
          format: int64
          description: 接收字节数;null 表示未知。
        latency_us:
          type:
            - integer
            - "null"
          description: 延迟(微秒);null 表示未知。
      additionalProperties: false
    ProxySqlDigest:
      type: object
      required:
        - digest
        - hostgroup
        - schemaname
        - count_star
        - sum_time
        - max_time
      properties:
        digest:
          type: string
          description: 摘要哈希,可作跨节点比对的稳定标识。
        hostgroup:
          type: integer
          description: hostgroup 编号。
        schemaname:
          type: string
          description: 库名。
        count_star:
          type: integer
          format: int64
          description: 执行次数。
        sum_time:
          type: integer
          format: int64
          description: 总耗时。
        max_time:
          type: integer
          format: int64
          description: 最大耗时。
      additionalProperties: false
    BackupState:
      type: object
      required:
        - root
        - tiers
        - next_run
        - last_trigger
      properties:
        root:
          type: string
          description: 备份根目录。
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/BackupTier"
          description: 各备份层级现状,可为空数组。
        next_run:
          type:
            - integer
            - "null"
          format: int64
          description: systemd 定时器下次触发时刻;没有定时器时为 null。
        last_trigger:
          type:
            - integer
            - "null"
          format: int64
          description: 上次触发时刻;null 表示未知。
      additionalProperties: false
    BackupTier:
      type: object
      description: 单个备份层级现状。
      required:
        - tier
        - last_success
        - age_seconds
        - size_bytes
        - directory
        - files
        - has_checksums
        - age_header_ok
      properties:
        tier:
          type: string
          description: hourly / daily / weekly。
        last_success:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次成功的时刻;null 表示没有成功记录,判为未知而非过期。
        age_seconds:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次成功距今秒数,新鲜度判定依据;hourly 阈值 5400 秒(90 分钟),daily 阈值 93600 秒(26 小时)。
        size_bytes:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次成功那份备份的体积;null 表示未知。
        directory:
          type: string
          description: 该层级的备份目录。
        files:
          type: integer
          description: 目录里归档文件个数。
        has_checksums:
          type: boolean
          description: 是否存在 SHA256SUMS 校验清单。
        age_header_ok:
          type:
            - boolean
            - "null"
          description: 归档是否为 age 格式(只检查文件头);null 表示无法判断。
      additionalProperties: false
    DbInspectRequest:
      type: object
      description: 只读巡检请求体,只接受幂等键一个字段(动作固定为 db_inspect,无动作负载)。
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
          description: 幂等键。同节点 + 同键复用既有任务并返回其 task_id;同键但参数摘要不同则 400 拒绝。
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 中文错误消息。不含凭据、环境变量、SQL 正文与文件内容。
      additionalProperties: false
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: 管理员密码，与初始化时写入的 Argon2 哈希比对。
      additionalProperties: false
    Session:
      type: object
      required:
        - csrf
        - expires
      properties:
        csrf:
          type: string
          description: 本会话的 CSRF 令牌，后续非 GET/HEAD 请求要写回 x-csrf-token 头。
        expires:
          type: integer
          format: int64
          description: 会话过期时间（Unix 秒）。
      additionalProperties: false
    Node:
      type: object
      required:
        - id
        - name
        - public_addresses
        - ssh_port
        - revoked
        - last_seen
        - address_version
      properties:
        id:
          type: string
        name:
          type: string
        public_addresses:
          type: array
          items:
            type: string
        overlay_address:
          type:
            - string
            - "null"
          description: 覆盖网地址，可缺失或为 null。
        ssh_port:
          type: integer
        revoked:
          type: boolean
        last_seen:
          type: integer
          format: int64
          description: 最近在线时间（Unix 秒）。
        capabilities:
          oneOf:
            - $ref: "#/components/schemas/NodeCapabilities"
            - type: "null"
        inventory:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 主机盘点原始数据，深度结构由 Agent 决定（任意 JSON 对象，不约束字段）。
        address_version:
          type: integer
          format: int64
          description: 该节点地址集合版本号。
        region:
          type:
            - string
            - "null"
          description: 展示用地域，缺省为 null。
        group:
          type:
            - string
            - "null"
          description: 展示用分组，缺省为 null。
        tags:
          type: array
          items:
            type: string
          description: 展示用标签，缺省为空数组。
        weight:
          type: integer
          description: 展示排序权重，缺省为 0。
        hidden:
          type: boolean
          description: 对未持分享令牌的访客隐藏，缺省为 false。
        public_remark:
          type:
            - string
            - "null"
          description: 公开备注，缺省为 null。
      additionalProperties: false
    NodeEntry:
      type: object
      required:
        - connected
        - node
      properties:
        connected:
          type: boolean
          description: 当前是否在线。运行时判定，不属于 Node 结构体。
        node:
          $ref: "#/components/schemas/Node"
      additionalProperties: false
    NodeCapabilities:
      type: object
      required:
        - os
        - docker
        - compose
        - systemd
        - firewall
      properties:
        os:
          type: string
        docker:
          type: boolean
        compose:
          type: boolean
        systemd:
          type: boolean
        firewall:
          type: array
          items:
            type: string
          description: 该节点可用的防火墙后端列表。
        metrics:
          type: boolean
          description: 指标采样能力，缺省 false。
        hostinfo:
          type: boolean
          description: 主机盘点能力，缺省 false。
        storage:
          type: boolean
          description: 存储集群能力，缺省 false。
        database:
          type: boolean
          description: 数据库只读巡检能力，缺省 false。
        probe:
          type: boolean
          description: 对端延迟探测能力，缺省 false。
      additionalProperties: false
    Registration:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: 节点名称，非空且不超过 100 字符。
        public_addresses:
          type: array
          items:
            type: string
          description: 可路由的公网地址，缺省为空数组。
        overlay_address:
          type:
            - string
            - "null"
          description: 覆盖网地址，须为合法 IP。
        ssh_port:
          type: integer
          minimum: 1
          description: SSH 端口，缺省 22。
      additionalProperties: false
    EnrollmentToken:
      type: object
      required:
        - token
        - node_id
        - expires_in
        - ca_fingerprint
      properties:
        token:
          type: string
          description: 注册令牌明文，一次性使用，仅在本次响应中出现。
        node_id:
          type: string
        expires_in:
          type: integer
          const: 600
        ca_fingerprint:
          type: string
          description: CA 证书 SHA-256 指纹（hex），供 Agent 核对。
      additionalProperties: false
    PeerAddressSet:
      type: object
      required:
        - version
        - addresses
      properties:
        version:
          type: integer
          format: int64
        addresses:
          type: array
          items:
            type: string
          description: 去重排序后的公网地址集合。
      additionalProperties: false
    ProbeTarget:
      type: object
      required:
        - node_id
        - address
      properties:
        node_id:
          type: string
        address:
          type: string
          description: 被探测地址，优先使用覆盖网地址。
        port:
          type:
            - integer
            - "null"
          description: 给了端口走 TCP 握手计时；为空时走 ICMP。
      additionalProperties: false
    ProbeTargetSet:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          format: int64
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ProbeTarget"
      additionalProperties: false
    StorageDeviceTarget:
      type: object
      required:
        - path
        - expected_size
        - mount
      properties:
        path:
          type: string
          description: 块设备路径。
        expected_size:
          type: integer
          format: int64
          description: 预期容量。与实测不符时预检拒绝，避免格式化错盘。
        mount:
          type: string
          description: 挂载点，例如 /data/disk1。
      additionalProperties: false
    DockerOperation:
      type: string
      enum:
        - start
        - stop
        - restart
    StackOperation:
      type: string
      enum:
        - start
        - stop
        - remove
    TaskStatus:
      type: string
      description: 任务状态。终态为 succeeded / failed / uncertain / rolled_back / blocked / cancelled。
      enum:
        - pending
        - accepted
        - running
        - validating
        - succeeded
        - failed
        - uncertain
        - rollback_pending
        - rolled_back
        - blocked
        - cancelled
    TaskAccepted:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string
          description: 任务 UUID。相同节点、相同幂等键、相同参数摘要的重放会返回同一个 id。
      additionalProperties: false
    AuditRecord:
      type: object
      required:
        - id
        - at
        - actor
        - node_id
        - category
        - target
        - result
        - detail
        - source
        - bytes
        - duration
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
          description: 落库时间（Unix 秒），排序与时间筛选的基准。
        actor:
          type: string
        node_id:
          type: string
        category:
          type: string
          description: 动作类别，例如 会话 / 文件 / 数据库 / 存储 / 防火墙 / 容器 / 分享页 / 主题。
        target:
          type: string
        result:
          type: string
          description: 结果语义，例如 已开始 / 已结束 / 成功 / 失败 / 已提交 / 已存在。
        detail:
          type: string
          description: 补充说明。依约定不含凭据、环境变量、SQL 正文与文件内容。
        source:
          type: string
          description: 来源 IP。
        bytes:
          type: integer
          format: int64
        duration:
          type: integer
          format: int64
      additionalProperties: false
    EntranceValue:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: 安全入口字符串。写入时必须 16 位，仅字母数字与 -._~，且不以 . 或 - 开头。
      additionalProperties: false
    EntranceUpdate:
      type: object
      required:
        - value
        - changed
      properties:
        value:
          type: string
        changed:
          type: boolean
          description: 与当前入口一致时为 false。
      additionalProperties: false
    EnrollRequest:
      type: object
      required:
        - token
        - csr
      properties:
        token:
          type: string
          description: 一次性注册令牌。
        csr:
          type: string
          description: PEM 编码的 CSR。
      additionalProperties: false
    EnrollResponse:
      type: object
      required:
        - node_id
        - certificate
      properties:
        node_id:
          type: string
        certificate:
          type: string
          description: 签名后的客户端证书 PEM，有效期 90 天。
      additionalProperties: false
    RenewRequest:
      type: object
      required:
        - csr
      properties:
        csr:
          type: string
      additionalProperties: false
    RenewResponse:
      type: object
      required:
        - certificate
      properties:
        certificate:
          type: string
          description: 续期后的客户端证书 PEM，有效期 90 天。
      additionalProperties: false
    VerifyRequest:
      type: object
      properties:
        witness:
          type:
            - string
            - "null"
          description: 指定验证节点 id；缺失时自动挑选一个非本节点的在线节点。
        required:
          type: boolean
          description: 无 witness 时是否必须独立验证，缺省 false。
      additionalProperties: false
    VerifyResponse:
      type: object
      required:
        - ok
        - fresh_tls
      properties:
        ok:
          type: boolean
          const: true
        fresh_tls:
          type: boolean
          const: true
          description: 恒为 true，表示结果来自新建连接而非复用连接。
      additionalProperties: false
    ConsoleEvent:
      type: object
      description: SSE 帧的 data 载荷，按 type 判别。
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - tasks
            - nodes
            - metrics
            - storage
            - database
            - task
            - resync
        task:
          $ref: "#/components/schemas/TaskEnvelope"
      additionalProperties: true
    TaskEvent:
      type: object
      required:
        - id
        - task_id
        - sequence
        - time
        - status
        - message
      properties:
        id:
          type: string
        task_id:
          type: string
        sequence:
          type: integer
          format: int64
          description: 事件序号，等于该次上报后的任务 sequence。
        time:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/TaskStatus"
        message:
          type: string
          description: 有错误时取错误文本，否则为状态描述。
      additionalProperties: false
    Submit:
      type: object
      required:
        - idempotency_key
        - action
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          minLength: 1
          description: 幂等键，非空且不超过 128 字符。
        action:
          $ref: "#/components/schemas/Action"
      additionalProperties: false
    FileSubmit:
      type: object
      required:
        - idempotency_key
        - action
      properties:
        idempotency_key:
          type: string
          description: 幂等键。与 actions 端点不同，本端点不校验其非空与长度。
        action:
          $ref: "#/components/schemas/FileRequest"
      additionalProperties: false
    FileRequest:
      description: |
        结构化文件操作，按 type 判别，拒绝未知字段。
        各变体的字段都是必填（只有 remove 的 recursive / confirmed 有默认值），与 Action 的文件类变体同形；
        缺字段会被框架在进入处理函数前拒绝（422 纯文本）。
      oneOf:
        - $ref: "#/components/schemas/FileRequestPut"
        - $ref: "#/components/schemas/FileRequestRemove"
        - $ref: "#/components/schemas/FileRequestRename"
        - $ref: "#/components/schemas/FileRequestMkdir"
        - $ref: "#/components/schemas/FileRequestChmod"
        - $ref: "#/components/schemas/FileRequestChown"
    FileRequestPut:
      type: object
      required:
        - type
        - path
        - digest
        - size
      properties:
        type:
          type: string
          const: put
        path:
          type: string
        digest:
          type: string
          description: 只有暂存内容摘要与它一致才会覆盖目标文件。
        size:
          type: integer
          format: int64
      additionalProperties: false
    FileRequestRemove:
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          const: remove
        path:
          type: string
        recursive:
          type: boolean
          default: false
        confirmed:
          type: boolean
          default: false
          description: 递归删除必须显式 true，缺省即拒绝。
      additionalProperties: false
    FileRequestRename:
      type: object
      required:
        - type
        - from
        - to
      properties:
        type:
          type: string
          const: rename
        from:
          type: string
        to:
          type: string
      additionalProperties: false
    FileRequestMkdir:
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          const: mkdir
        path:
          type: string
      additionalProperties: false
    FileRequestChmod:
      type: object
      required:
        - type
        - path
        - mode
      properties:
        type:
          type: string
          const: chmod
        path:
          type: string
        mode:
          type: integer
          description: 权限位。
      additionalProperties: false
    FileRequestChown:
      type: object
      required:
        - type
        - path
        - uid
        - gid
      properties:
        type:
          type: string
          const: chown
        path:
          type: string
        uid:
          type: integer
        gid:
          type: integer
      additionalProperties: false
    Action:
