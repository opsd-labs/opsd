          type: string
          description: 明文令牌,仅此一次返回,之后无法再取回。
        record:
          $ref: "#/components/schemas/ShareToken"
      additionalProperties: false
    ApiKeyInput:
      description: "创建 API 密钥的请求体。拒绝未知字段（serde deny_unknown_fields），与 additionalProperties: false 一致。"
      type: object
      required:
        - label
      properties:
        label:
          type: string
          maxLength: 60
          description: 密钥名称,trim 后非空且不超过 60 字符,否则 400。
        nodes:
          type:
            - array
            - "null"
          items:
            type: string
          description: 限定可见节点 id 列表;省略或 null 表示全部。
    ApiKey:
      type: object
      required:
        - id
        - label
        - digest
        - created_at
        - last_used
        - revoked
        - nodes
      properties:
        id:
          type: string
          description: 密钥记录 id。
        label:
          type: string
          description: 密钥名称。
        digest:
          type: string
          description: sha256(明文密钥) 十六进制摘要;明文永不落库、不再出现在任何响应中。
        created_at:
          type: integer
          format: int64
          description: 创建时间,Unix 秒。
        last_used:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次机器接口使用时间,Unix 秒;从未使用或较上次写入相差不超过 60 秒时为 null 或旧值(只在相差超过 60 秒时才写回)。
        revoked:
          type: boolean
          description: 是否已撤销。
        nodes:
          type:
            - array
            - "null"
          items:
            type: string
          description: 限定可见节点 id 列表;null 表示全部(授权时与分享令牌范围取交集)。
      additionalProperties: false
    ApiKeyList:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
          description: 按 created_at 降序;只含摘要与元数据,绝不包含明文密钥(明文仅创建响应一次)。
      additionalProperties: false
    ApiKeyCreated:
      type: object
      required:
        - key
        - record
      properties:
        key:
          type: string
          description: 明文密钥(opsd_ 前缀),仅此一次返回,之后无法再取回。
        record:
          $ref: "#/components/schemas/ApiKey"
          description: 密钥记录本身,last_used 为 null。
      additionalProperties: false
    PublicNode:
      type: object
      required:
        - id
        - name
        - online
        - region
        - group
        - tags
        - weight
        - remark
        - cpu_usage
        - memory_used
        - memory_total
        - disk_used
        - disk_total
        - load1
        - net_rx_bytes_per_second
        - net_tx_bytes_per_second
        - uptime
        - metrics_at
        - metrics_status
      properties:
        id:
          type: string
          description: 节点编号。
        name:
          type: string
          description: 节点显示名。
        online:
          type: boolean
          description: 是否在线（存在通道连接）。
        region:
          type:
            - string
            - "null"
          description: 区域，可缺省可 null。
        group:
          type:
            - string
            - "null"
          description: 分组，可缺省可 null。
        tags:
          type: array
          items:
            type: string
          description: 标签列表，缺省为空数组。
        weight:
          type: integer
          format: int64
          description: 排序权重。
        remark:
          type:
            - string
            - "null"
          description: 公开备注（内部字段 public_remark 的公开别名），可缺省可 null。
        cpu_usage:
          type:
            - number
            - "null"
          description: CPU 使用百分比，无采样为 null（不是 0）。
        memory_used:
          type:
            - integer
            - "null"
          format: int64
          description: 已用内存字节，无采样为 null。
        memory_total:
          type:
            - integer
            - "null"
          format: int64
          description: 内存总量字节，无采样为 null。
        disk_used:
          type:
            - integer
            - "null"
          format: int64
          description: 磁盘总已用字节（累加各挂载点），无采样为 null。
        disk_total:
          type:
            - integer
            - "null"
          format: int64
          description: 磁盘总容量字节，无采样为 null。
        load1:
          type:
            - number
            - "null"
          description: 1 分钟平均负载，无采样为 null。
        net_rx_bytes_per_second:
          type:
            - integer
            - "null"
          format: int64
          description: 入站速率，各网卡求和后取整，无采样为 null。
        net_tx_bytes_per_second:
          type:
            - integer
            - "null"
          format: int64
          description: 出站速率，各网卡求和后取整，无采样为 null。
        uptime:
          type:
            - integer
            - "null"
          format: int64
          description: 运行时长秒，无采样为 null。
        metrics_at:
          type:
            - integer
            - "null"
          format: int64
          description: 最近一次成功采样的接收时刻（Unix 秒）；没有成功采样时为 null。采集失败上报不会刷新它。
        metrics_status:
          type: string
          enum:
            - ok
            - collect_failed
            - unknown
          description: |
            当前采集状态：ok=最近上报成功；collect_failed=最近上报失败（指标字段仍是上次成功值）；
            unknown=从未上报。与 online 互不替代。
      additionalProperties: false
    Point:
      type: object
      required:
