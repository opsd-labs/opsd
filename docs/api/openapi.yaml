      description: |
        删除主题记录、该主题已保存的设置（theme_settings_<short>）与资源目录；删除的正好是启用中的
        主题时同时清除启用记录、回落到内置主题。内置主题 default（忽略大小写）保留不可删。
      responses:
        "200":
          description: 已删除。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: short 为 default（忽略大小写，「内置主题不可删除」）；或未安装该主题（「主题不存在」）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
  /share/{token}/data/theme:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文，门禁按 sha256 摘要查找。
    get:
      tags:
        - theme
      summary: 读取分享页公开主题数据
      description: |
        返回分享页当前启用主题的 describe 输出：short、名称、令牌、公开设置与配置项声明。
        设置与配置项声明公开可读，不得放入密钥；未启用包级主题时同样返回内置主题形态
        （short 为 default），不报错。
      servers:
        - url: https://{host}
          variables:
            host:
              default: localhost:65535
              description: 主控 HTTPS 监听地址
      security: []
      responses:
        "200":
          description: 分享页主题公开数据。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeDescribe"
        "404":
          description: 令牌无效、过期或被撤销（门禁直接丢弃，不产生业务响应）。空正文。
  /share/{token}/theme/{path}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文，门禁按 sha256 摘要查找。
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: 主题资源相对路径（资源目录内），可含子路径。
    get:
      tags:
        - theme
      summary: 读取分享页主题资源
      description: |
        返回主题资源原始字节。Content-Type 按扩展名推测：js/mjs→text/javascript、css→text/css、
        html→text/html; charset=utf-8、svg→image/svg+xml、json→application/json、png→image/png、
        jpg/jpeg→image/jpeg、webp→image/webp、woff2→font/woff2，其余→application/octet-stream；
        并附独立 CSP 响应头（default-src 'none'，只放行 self，内联样式例外）。路径必须落在该主题
        资源目录内；未启用包级分享主题时本端点恒 404。
      servers:
        - url: https://{host}
          variables:
            host:
              default: localhost:65535
              description: 主控 HTTPS 监听地址
      security: []
      responses:
        "200":
          description: 主题资源原始字节，带按扩展名推测的 Content-Type 与 CSP 响应头。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: |
            令牌无效/过期/被撤销、path 包含 .. 或以 / 开头、当前未启用包级分享主题（has_assets=false）、
            或资源读取失败。空正文。
  /api/v1/storage/readiness:
    get:
      tags:
        - storage
      summary: 存储预检报告
      description: |
        结论式报告：逐节点给出适合等级与原因、一致性检查、推荐拓扑，以及总体是否可直接进入部署计划。
        只读：读 DB 里节点、在线通道与内存盘点缓存，不改库、不下发任务、不广播事件。
        未采集的节点标为「待采集」，不会被当作不适合。
      responses:
        "200":
          description: 预检报告。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 内部盘点缓存读锁失败，正文 {"error":"盘点缓存不可用"}。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/nodes/{id}/host-inspect:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      tags:
        - storage
      summary: 触发节点主机盘点
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        只读操作但走任务机制以便看到执行结果：写库登记 HostInspect 任务，任务为 Pending 时向该节点通道下发，
        并广播 events。成功返回 200 + task_id（不是 202）。幂等键用于去重同一个盘点动作。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInspectRequest"
      responses:
        "200":
          description: 已接受任务的 id，供任务面板回溯。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          description: |
            同节点同 idempotency_key 已用于参数不同的动作时返回「幂等键已用于不同参数」；
            其他错误（如任务入库失败）返回对应 DB 错误信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/storage/clusters:
    get:
      tags:
        - storage
      summary: 集群定义列表
      description: |
        已定义集群列表；每个集群的 secret_key 一律删除并替换为 has_secret_key 布尔（密钥不回传）。
        同时返回固定的镜像仓库前缀、文件系统与最小节点数，界面据此生成选择项。
      responses:
        "200":
          description: 集群列表与固定常量。
          content:
            application/json:
              schema:
                type: object
                required:
                  - clusters
                  - image_prefix
                  - filesystem
                  - min_nodes
                properties:
                  clusters:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClusterListItem"
                  image_prefix:
                    type: string
                    const: pgsty/silo
                    description: 允许的镜像仓库前缀，固定为 pgsty/silo。
                  filesystem:
                    type: string
                    const: xfs
                    description: 固定文件系统，xfs。
                  min_nodes:
                    type: integer
                    const: 4
                    description: 分布式部署允许的最小节点数。
                additionalProperties: false
        "400":
          description: 列集群失败，正文为对应 DB 错误信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    put:
      tags:
        - storage
      summary: 保存集群定义
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        只写定义，不碰任何节点。created_at 由服务端填写：新建时设为当前时间，已存在则保留旧值。
        校验失败返回 400 与中文校验消息。成功返回 200。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterSpec"
      responses:
        "200":
          description: 保存后的集群定义，含服务端填写的 created_at；secret_key 原样回传（保存的是全量定义）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - cluster
                properties:
                  cluster:
                    $ref: "#/components/schemas/ClusterSpec"
                additionalProperties: false
        "400":
          description: |
            validate_spec 任一校验失败（集群名称长度不合法 / 名称只能包含字母数字连字符下划线 /
            节点数不足 / 节点列表存在重复 / 镜像标签不合法 / 不接受 latest 标签 /
            标签应形如 RELEASE.<时间戳> 或具体版本号 / 必须给出集群对外服务地址 /
            访问凭据不合法：密钥至少 16 个字符），或保存失败时返回对应 DB 错误信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/storage/plans:
    post:
      tags:
        - storage
      summary: 生成部署计划
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        计划精确列出将被清空的每一块设备及其计划时的容量，并带 fingerprint 指纹与 5 分钟有效期
        （expires = now()+300）。本步只把「将要发生什么」固化下来，不写任何节点。
        生成时逐一校验集群定义存在、节点存在 / 未撤销 / 在线 / 已盘点 / 有可用盘、各节点盘数一致。
        成功返回 200 + plan。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRefRequest"
      responses:
        "200":
          description: 生成的部署计划。
          content:
            application/json:
              schema:
                type: object
                required:
                  - plan
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
                additionalProperties: false
        "400":
          description: |
            正文为对应中文消息：集群定义不存在 / 节点不存在：<id> / 节点已撤销：<id> /
            节点离线，不能纳入计划：<id> / 节点尚未盘点，不能纳入计划：<id> /
            节点没有可用磁盘，不能纳入计划：<name> /
            各节点可用磁盘数量不一致（<数量列表>），请先补齐再部署 / 保存计划失败（DB 错误信息）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          description: 盘点缓存读锁失败，正文 {"error":"盘点缓存不可用"}。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/storage/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 计划 id。
    get:
      tags:
        - storage
      summary: 读取部署计划
      description: 返回计划全文与是否已过期（expired = plan.expires <= now()）。只读 storage_plans 桶。
      responses:
        "200":
          description: 计划全文与过期标志。
          content:
            application/json:
              schema:
                type: object
                required:
                  - plan
                  - expired
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
                  expired:
                    type: boolean
                    description: 计划是否已过期（expires <= now()）。
                additionalProperties: false
        "400":
          description: 按 id 查不到计划时返回「计划不存在」。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/storage/plans/apply:
    post:
      tags:
        - storage
      summary: 执行部署计划
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        逐节点串行执行：每节点按「磁盘准备 → 容器部署」两步各下发一个任务（各生成一个 task_id）。
        任一节点任一步失败即记录到 plan.failed（写审计「已阻断后续节点」）并阻断后续节点，整单返回 400。
        执行前按节点实时盘点重新核对：节点离线、盘点丢失、设备消失、容量变化、设备不再是无使用痕迹状态、
        指纹不一致，任何一项不符即整单拒绝。破坏性计划（destructive=true）必须显式确认
        acknowledge_destructive=true 才能执行。全部成功时写含「不可逆磁盘格式化」的审计。
        返回 200（不是 202）与本次下发清单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePlanApplyRequest"
      responses:
        "200":
          description: 本次执行的计划 id、每个节点每个已下发步骤的记录与已完整执行完成的节点列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePlanApplyResult"
        "400":
          description: |
            执行前校验或执行中失败，正文为对应中文消息：计划不存在 / 集群定义已不存在，请重新生成计划 /
            计划已过期，请重新生成 / 该计划包含不可逆的磁盘格式化，必须显式确认后才能执行 /
            计划已有失败节点，不能继续执行 / 节点 <name> 已离线，计划作废 /
            节点 <name> 的盘点结果已丢失，计划作废 / 设备 <path> 在 <name> 上已不存在，计划作废 /
            设备 <path> 容量已变化（计划 <n> 字节，实际 <n> 字节），计划作废 /
            设备 <path> 已不再是无使用痕迹的状态，计划作废 / 计划的设备清单已被修改，请重新生成 /
            节点 <name> 执行失败，已阻断后续节点：<reason>。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          description: 盘点缓存读锁失败，正文 {"error":"盘点缓存不可用"}。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/storage/status:
    post:
      tags:
        - storage
      summary: 触发集群状态采集
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        登记 StorageStatus 任务并下发给集群中首个在线节点（通道不可用即 400）。
        成功返回 200 + task_id（不是 202），label 固定为「状态」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRefRequest"
      responses:
        "200":
          description: 已下发的状态采集任务。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTaskAccepted"
        "400":
          description: |
            正文为对应中文消息：集群不存在 / 集群没有在线节点 / 节点通道不可用 / 任务入库失败（DB 错误信息）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/storage/buckets:
    post:
      tags:
        - storage
      summary: 创建或删除存储桶
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        桶是集群级操作，在任一在线节点执行即可，不逐节点下发。remove=true 时删除桶而非创建。
        成功返回 200 + task_id（不是 202），label 固定为「桶」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketRequest"
      responses:
        "200":
          description: 已下发的桶任务。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTaskAccepted"
        "400":
          description: |
            正文为对应中文消息：集群不存在 / 集群没有在线节点 / 节点通道不可用 / 任务入库失败（DB 错误信息）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/storage/users:
    post:
      tags:
        - storage
      summary: 创建或删除集群访问用户
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        用户是集群级操作，下发到任一在线节点执行，不逐节点下发。remove=true 时删除用户，
        policy 缺省 readwrite。成功返回 200 + task_id（不是 202），label 固定为「用户」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: 已下发的用户任务。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTaskAccepted"
        "400":
          description: |
            正文为对应中文消息：集群不存在 / 集群没有在线节点 / 节点通道不可用 / 任务入库失败（DB 错误信息）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/database/overview:
    get:
      tags:
        - database
      summary: 数据库只读巡检总览
      description: |
        只读视图:按名称排序返回各节点结论(不含已撤销节点)、跨节点一致性检查结论与汇总。
        整个视图不含任何凭据类字段:configured 只是「已配置只读账号」的布尔标记,报告与审计均无
        账号、密码、令牌字段,Agent 侧凭据只存在于节点本机。
        未知项如实单列,绝不冒充正常:「未知不等于 0」由 null 值与 unknown 列表表达,不补 0。
      responses:
        "200":
          description: 巡检总览。expected_cluster_size 取各报告的第一个非零期望成员数,全部为 0 时此值为 0。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 巡检缓存不可用,正文 {"error":"巡检缓存不可用"}。内存巡检缓存读锁中毒时出现,正常情况不可达。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/nodes/{id}/db-inspect:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      tags:
        - database
      summary: 下发数据库只读巡检
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        创建一次只读巡检任务:新建且节点在线时立即经 Agent 长连接下发并广播 database 事件,
        离线时留待调度;不校验节点是否存在。幂等键去重:同节点 + 同键复用既有任务并返回
        同一 task_id,不重复下发。审计记录只含对象与结果,不含 SQL 正文与凭据。
        注意返回 200 而不是约定中的 202(历史原因,与文件面一致),task_id 可用于查询
        /api/v1/tasks/{id} 的执行结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbInspectRequest"
      responses:
        "200":
          description: 已受理,正文为 {"task_id":"<任务 UUID>"}。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          description: |
            拒绝受理,正文为 {"error":"<中文消息>"}:同节点同键但参数摘要不同时报
            「幂等键已用于不同参数」(历史原因 400 而非 409);accept_task 其余失败
            (参数摘要不匹配、写入错误)同样映射为 400。请求体不是合法 JSON、字段类型不匹配
            或含未知字段时,见 components/responses/BadRequest(纯文本)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: opsd_session
      description: 管理员会话。HttpOnly、Secure、SameSite=Strict，Path 限定在 /{安全入口}/ 之下。
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: 必须等于 Session.csrf。只对非 GET/HEAD 请求校验；失败返回 403 纯文本。
    bearerApiKey:
      type: http
      scheme: bearer
      description: 分享机器接口的 API Key。分享令牌仍通过路径参数校验，两者范围取交集。
    agentMtls:
      type: mutualTLS
      description: Agent 客户端证书（mTLS）。仅 Agent 监听面使用。
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 节点编号。所有资源一律以 node_id + resource_id 定位。
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 任务 UUID。
  responses:
    Unauthorized:
      description: 未登录。正文 {"error":"请先登录"}。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OriginOrCsrfRejected:
      description: Origin 或 CSRF 校验失败。注意正文是**纯文本**，不是 JSON。
      content:
        text/plain:
          schema:
            type: string
            const: 请求来源或 CSRF 校验失败
    BadRequest:
      description: 业务 {"error"} 与框架纯文本 400 的双形态。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        text/plain:
          schema:
            type: string
    UnsupportedMediaType:
      description: Content-Type 不是 application/json。正文是**纯文本**。
      content:
        text/plain:
          schema:
            type: string
    UnprocessableEntity:
      description: JSON 合法但无法反序列化（字段缺失/类型错/未知字段）。axum 0.8 返回 422，正文纯文本。
      content:
        text/plain:
          schema:
            type: string
    PayloadTooLarge:
      description: 请求体超过控制台面 1MB 上限。
  schemas:
    MetricsOverviewNode:
      type: object
      description: 控制台指标总览条目：最近成功采样 + 当前采集状态。与上报帧分离，避免失败上报冲掉成功值。
      required: [node_id, received_at, clock_offset, sample, metrics_at, metrics_status]
      properties:
        node_id:
          type: string
        received_at:
          type: [integer, "null"]
          format: int64
          description: 最近一次成功采样接收时刻；无成功采样时为 null。
        clock_offset:
          type: integer
          format: int64
        sample:
          oneOf:
            - $ref: "#/components/schemas/MetricsSample"
            - type: "null"
        error:
          type: [string, "null"]
          description: 最近一次上报的失败原因；当前成功时为 null。
        metrics_at:
          type: [integer, "null"]
          format: int64
          description: 同 received_at，供界面统一读取新鲜度。
        metrics_status:
          type: string
          enum: [ok, collect_failed, unknown]
      additionalProperties: false
    MetricsSample:
      type: object
      description: 一次主机指标采样。数值单位写在字段名中（bytes_per_second / 百分比），展示层无需再猜单位。
      required:
        - at
        - cpu_usage
        - cpu_per_core
        - load1
        - load5
        - load15
        - memory_total
        - memory_used
        - memory_available
        - swap_total
        - swap_used
        - disks
        - disk_read_bytes_per_second
        - disk_write_bytes_per_second
        - interfaces
        - uptime
        - processes
        - tcp_connections
        - udp_connections
      properties:
        at:
          type: integer
          format: int64
          description: 采样时刻（秒，Agent 本地时钟）；主控据此估算时钟偏移。
        cpu_usage:
          type: number
          description: CPU 使用率（百分比）。
        cpu_per_core:
          type: array
          items:
            type: number
          description: 每核 CPU 使用率。
        load1:
          type: number
        load5:
          type: number
        load15:
          type: number
        memory_total:
          type: integer
          format: int64
          description: 内存总量（字节）。
        memory_used:
          type: integer
          format: int64
          description: 已用内存（字节）。
        memory_available:
          type: integer
          format: int64
          description: 可用内存（字节）。
        swap_total:
          type: integer
          format: int64
          description: 交换分区总量（字节）。
        swap_used:
          type: integer
          format: int64
          description: 已用交换分区（字节）。
        disks:
          type: array
          items:
            $ref: "#/components/schemas/DiskUsage"
        disk_read_bytes_per_second:
          type: number
        disk_write_bytes_per_second:
          type: number
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceRate"
        uptime:
          type: integer
          format: int64
          description: 系统运行时长（秒）。
        processes:
          type: integer
          format: int64
          description: 进程数。
        tcp_connections:
          type: integer
          format: int64
          description: TCP 连接数。
        udp_connections:
          type: integer
          format: int64
          description: UDP 连接数。
        peers:
          type: array
          items:
            $ref: "#/components/schemas/PeerLatency"
          description: 到各对端的延迟。探测频率低于采样频率，多数采样为空，稀疏探测时沿用上一次结果。
      additionalProperties: false
    MetricsPoint:
      type: object
      description: 指标曲线上一个点。字段扁平、单位明确，便于直接绘图；缺失区间不插值不补零，直接缺点。
      required:
        - at
        - cpu_usage
        - memory_used
        - memory_total
        - swap_used
        - load1
        - disk_read_bytes_per_second
        - disk_write_bytes_per_second
        - net_rx_bytes_per_second
        - net_tx_bytes_per_second
      properties:
        at:
          type: integer
          format: int64
          description: 桶时刻（秒）。
        cpu_usage:
          type: number
          description: CPU 使用率（百分比），桶内取平均。
        memory_used:
          type: integer
          format: int64
          description: 已用内存（字节）。
        memory_total:
          type: integer
          format: int64
          description: 内存总量（字节）。
        swap_used:
          type: integer
          format: int64
          description: 已用交换分区（字节）。
        load1:
          type: number
        disk_read_bytes_per_second:
          type: number
        disk_write_bytes_per_second:
          type: number
        net_rx_bytes_per_second:
          type: number
          description: 所有网卡接收速率求和。
        net_tx_bytes_per_second:
          type: number
          description: 所有网卡发送速率求和。
      additionalProperties: false
    PeerLatency:
      type: object
      description: 到单个对端节点的延迟测量结果。
      required:
        - node_id
        - address
        - method
        - reachable
      properties:
        node_id:
          type: string
        address:
          type: string
        method:
          type: string
          enum:
            - icmp
            - tcp
        latency_ms:
          type:
            - number
            - "null"
          description: 延迟（毫秒）。没测到时为 null 或缺省，绝不补 0（0 表示同机）。
        reachable:
          type: boolean
          description: 是否可达。
        error:
          type:
            - string
            - "null"
          description: 不可达原因。
        probed_at:
          type: integer
          format: int64
          description: 测量时刻，可早于采样时刻。
      additionalProperties: false
    InterfaceRate:
      type: object
      description: 单个网络接口的速率与累计错误。
      required:
        - name
        - rx_bytes_per_second
        - tx_bytes_per_second
        - rx_errors
        - tx_errors
      properties:
        name:
          type: string
          description: 接口名。
        rx_bytes_per_second:
          type: number
        tx_bytes_per_second:
          type: number
        rx_errors:
          type: integer
          format: int64
          description: 接收错误累计。
        tx_errors:
          type: integer
          format: int64
          description: 发送错误累计。
      additionalProperties: false
    DiskUsage:
      type: object
      description: 真实挂载点的容量与 inode 用量。
      required:
        - mount
        - filesystem
        - total
        - used
        - inode_total
        - inode_used
      properties:
        mount:
          type: string
          description: 挂载点。
        filesystem:
          type: string
          description: 文件系统类型；底层为 /proc/mounts 的对应字段，块设备写入设备路径。
        total:
          type: integer
          format: int64
          description: 容量（字节）。
        used:
          type: integer
          format: int64
          description: 已用（字节）。
        inode_total:
          type: integer
          format: int64
          description: inode 总数。
        inode_used:
          type: integer
          format: int64
          description: 已用 inode 数。
      additionalProperties: false
    MetricsTierInfo:
      type: object
      description: 单个指标层级的保留状态汇总。
      required:
        - tier
        - bucket_seconds
        - retention_seconds
        - records
        - oldest
      properties:
        tier:
          type: string
          enum:
            - raw
            - m5
            - h1
          description: 层级名。
        bucket_seconds:
          type: integer
          description: 桶宽（秒）：raw=15、m5=300、h1=3600。
        retention_seconds:
          type: integer
          format: int64
          description: 保留时长（秒）：raw=7 天、m5=90 天、h1=365 天。
        records:
          type: integer
          format: int64
          description: 该层级当前记录数。
        oldest:
          type:
            - integer
            - "null"
          format: int64
          description: 最早一条记录的时刻（Unix 秒）；无记录时为 null。
      additionalProperties: false
    ShareSettingsInput:
      description: "更新分享设置的请求体。拒绝未知字段（serde deny_unknown_fields），与 additionalProperties: false 一致。"
      type: object
      required:
        - enabled
        - site
      properties:
        enabled:
          type: boolean
          description: 分享页整体开关。
        site:
          $ref: "#/components/schemas/SitePublic"
          description: 站点公开信息;其下 name/description/footer 三者均必填。
    ShareSettings:
      type: object
      required:
        - enabled
        - site
      properties:
        enabled:
          type: boolean
          description: 分享页整体开关。
        site:
          $ref: "#/components/schemas/SitePublic"
      additionalProperties: false
    SitePublic:
      type: object
      required:
        - name
        - description
        - footer
      properties:
        name:
          type: string
          maxLength: 60
          description: 站点名称,缺省 "opsd";写入时超过 60 字符被拒。
        description:
          type: string
          maxLength: 200
          description: 站点描述,缺省 "节点状态";写入时超过 200 字符被拒。
        footer:
          type: string
          maxLength: 200
          description: 页脚自定义文字,不允许 HTML,缺省为空串;写入时超过 200 字符被拒。
      additionalProperties: false
    ShareTokenInput:
      description: "创建分享令牌的请求体。拒绝未知字段（serde deny_unknown_fields），与 additionalProperties: false 一致。"
      type: object
      required:
        - label
      properties:
        label:
          type: string
          maxLength: 60
          description: 分享名称,trim 后非空且不超过 60 字符,否则 400。
        expires_hours:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          maximum: 8760
          description: 有效小时数,范围 1..=8760(24*365);省略或 null 表示长期有效。
        nodes:
          type:
            - array
            - "null"
          items:
            type: string
          description: 限定可见节点 id 列表;省略或 null 表示全部未隐藏节点。
    ShareToken:
      type: object
      required:
        - id
        - label
        - digest
        - created_at
        - expires_at
        - nodes
        - revoked
      properties:
        id:
          type: string
          description: 令牌记录 id。
        label:
          type: string
          description: 分享名称。
        digest:
          type: string
          description: sha256(明文令牌) 十六进制摘要,门禁常量时间查找用;明文永不落库、不再出现在任何响应中。
        created_at:
          type: integer
          format: int64
          description: 创建时间,Unix 秒。
        expires_at:
          type:
            - integer
            - "null"
          format: int64
          description: 到期时间,Unix 秒;键恒存在,null 表示长期有效。
        nodes:
          type:
            - array
            - "null"
          items:
            type: string
          description: 限定可见节点 id 列表;null 表示全部未隐藏节点。
        revoked:
          type: boolean
          description: 是否已撤销;撤销后门禁立即失效,记录仍留在列表。
      additionalProperties: false
    ShareTokenList:
      type: object
      required:
