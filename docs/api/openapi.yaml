        Agent 侧不存在接收任意命令的接口。
      oneOf:
        - $ref: "#/components/schemas/ActionInspect"
        - $ref: "#/components/schemas/ActionHostInspect"
        - $ref: "#/components/schemas/ActionDbInspect"
        - $ref: "#/components/schemas/ActionDockerInspect"
        - $ref: "#/components/schemas/ActionDocker"
        - $ref: "#/components/schemas/ActionPullImage"
        - $ref: "#/components/schemas/ActionStackImport"
        - $ref: "#/components/schemas/ActionStackCreate"
        - $ref: "#/components/schemas/ActionStackPlan"
        - $ref: "#/components/schemas/ActionStackApply"
        - $ref: "#/components/schemas/ActionStackControl"
        - $ref: "#/components/schemas/ActionFirewallPlan"
        - $ref: "#/components/schemas/ActionFirewallApply"
        - $ref: "#/components/schemas/ActionPeerSync"
        - $ref: "#/components/schemas/ActionPeerProbeTargets"
        - $ref: "#/components/schemas/ActionFilePut"
        - $ref: "#/components/schemas/ActionFileRemove"
        - $ref: "#/components/schemas/ActionFileRename"
        - $ref: "#/components/schemas/ActionFileMkdir"
        - $ref: "#/components/schemas/ActionFileChmod"
        - $ref: "#/components/schemas/ActionFileChown"
        - $ref: "#/components/schemas/ActionStoragePrepare"
        - $ref: "#/components/schemas/ActionStorageDeploy"
        - $ref: "#/components/schemas/ActionStorageStatus"
        - $ref: "#/components/schemas/ActionStorageBucket"
        - $ref: "#/components/schemas/ActionStorageUser"
    ActionInspect:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: inspect
      additionalProperties: false
    ActionHostInspect:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: host_inspect
      additionalProperties: false
    ActionDbInspect:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: db_inspect
      additionalProperties: false
    ActionDockerInspect:
