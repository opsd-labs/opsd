  /api/v1/nodes/{id}/metrics:
    get:
      tags:
        - metrics
      summary: 节点指标历史
      description: |
        只读指标表：按步长选择层级（step<300 用 raw，<3600 用 m5，其余用 h1）并抽稀。
        降采样桶内标量取平均、明细取最后一次；区间内没有数据的时段不插值、不补零，直接缺空。
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 起始时刻（Unix 秒）。
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 结束时刻（Unix 秒），必须晚于 from。
        - name: step
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 60
          description: 期望点间距（秒），默认 60；实际值被 clamp 到 [15, 86400]，同时决定降采样层级。
      responses:
        "200":
          description: 抽稀后的指标点列与查询元信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - node_id
                  - tier
                  - step
                  - from
                  - to
                  - truncated
                  - points
                properties:
                  node_id:
                    type: string
                    description: 路径中的节点编号。
                  tier:
                    type: string
                    enum:
                      - raw
                      - m5
                      - h1
                    description: 实际使用的层级，由 clamp 后的步长决定。
                  step:
                    type: integer
                    description: clamp 到 [15, 86400] 后的实际步长（秒）。
                  from:
                    type: integer
                    format: int64
                    description: 请求的起始时刻（Unix 秒）。
                  to:
                    type: integer
                    format: int64
                    description: 请求的结束时刻（Unix 秒）。
                  truncated:
                    type: boolean
                    description: 是否因超过单次查询点数上限 MAX_POINTS（2000）而截断。
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetricsPoint"
        "400":
          description: |
            参数不满足或查询失败：to<=from 时正文为 {"error":"结束时间必须晚于开始时间"}；
            (to-from)/step 超过 MAX_POINTS（2000）时正文为 {"error":"区间与步长组合返回点数过多"}；
            数据库查询失败时由内部错误统一映射为 400。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
