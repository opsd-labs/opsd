        - type
        - project
        - directory
        - files
        - env_files
      properties:
        type:
          type: string
          const: stack_import
        project:
          type: string
        directory:
          type: string
        files:
          type: array
          items:
            type: string
        env_files:
          type: array
          items:
            type: string
      additionalProperties: false
    ActionStackCreate:
      type: object
      required:
        - type
        - project
        - content
      properties:
        type:
          type: string
          const: stack_create
        project:
          type: string
        content:
          type: string
          description: Compose 配置正文。在任务列表与详情中会被脱敏为「[配置正文已隐藏]」。
      additionalProperties: false
    ActionStackPlan:
      type: object
      required:
        - type
        - project
        - content
      properties:
        type:
          type: string
          const: stack_plan
        project:
          type: string
        content:
          type: string
          description: Compose 配置正文。在任务列表与详情中会被脱敏为「[配置正文已隐藏]」。
      additionalProperties: false
    ActionStackApply:
      type: object
      required:
        - type
        - plan_id
      properties:
        type:
          type: string
          const: stack_apply
        plan_id:
          type: string
      additionalProperties: false
    ActionStackControl:
      type: object
      required:
        - type
        - project
        - operation
      properties:
        type:
          type: string
          const: stack_control
        project:
          type: string
        operation:
          $ref: "#/components/schemas/StackOperation"
      additionalProperties: false
    ActionFirewallPlan:
      type: object
      required:
        - type
        - operation
      properties:
        type:
          type: string
          const: firewall_plan
        operation:
          type: object
          description: 防火墙计划负载。源码为自由 JSON，结构由防火墙计划语义决定。
          additionalProperties: true
      additionalProperties: false
    ActionFirewallApply:
      type: object
      required:
        - type
        - plan_id
      properties:
        type:
          type: string
          const: firewall_apply
        plan_id:
          type: string
        witness:
          type:
            - string
            - "null"
          description: 验证节点。必须是与本节点不同的在线节点；缺失时自动挑选。
      additionalProperties: false
    ActionPeerSync:
      type: object
      description: 仅由节点目录生成，外部提交会被 400 拒绝。
      required:
        - type
        - set
      properties:
        type:
          type: string
          const: peer_sync
        set:
          $ref: "#/components/schemas/PeerAddressSet"
      additionalProperties: false
    ActionPeerProbeTargets:
      type: object
      required:
        - type
        - set
      properties:
        type:
          type: string
          const: peer_probe_targets
        set:
          $ref: "#/components/schemas/ProbeTargetSet"
      additionalProperties: false
    ActionFilePut:
      type: object
      required:
        - type
        - path
        - digest
        - size
      properties:
        type:
          type: string
          const: file_put
        path:
          type: string
        digest:
          type: string
        size:
          type: integer
          format: int64
      additionalProperties: false
    ActionFileRemove:
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          const: file_remove
        path:
          type: string
        recursive:
          type: boolean
          default: false
        confirmed:
          type: boolean
          default: false
          description: 递归删除必须显式 true，缺省即拒绝。
      additionalProperties: false
    ActionFileRename:
      type: object
      required:
        - type
        - from
        - to
      properties:
        type:
          type: string
          const: file_rename
        from:
          type: string
        to:
          type: string
      additionalProperties: false
    ActionFileMkdir:
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          const: file_mkdir
        path:
          type: string
      additionalProperties: false
    ActionFileChmod:
      type: object
      required:
        - type
        - path
        - mode
      properties:
        type:
          type: string
          const: file_chmod
        path:
          type: string
        mode:
          type: integer
      additionalProperties: false
    ActionFileChown:
      type: object
      required:
        - type
        - path
        - uid
        - gid
      properties:
        type:
          type: string
          const: file_chown
        path:
          type: string
        uid:
          type: integer
        gid:
          type: integer
      additionalProperties: false
    ActionStoragePrepare:
      type: object
      description: 全系统唯一会销毁数据的操作：会清空 devices 中列出的每一块盘。
      required:
        - type
        - cluster
        - plan_id
        - devices
        - filesystem
      properties:
        type:
          type: string
          const: storage_prepare
        cluster:
          type: string
        plan_id:
          type: string
          description: 计划编号，仅用于把执行与计划、审计串起来。
        devices:
          type: array
          items:
            $ref: "#/components/schemas/StorageDeviceTarget"
        filesystem:
          type: string
          description: 文件系统类型，目前只接受 xfs。
      additionalProperties: false
    ActionStorageDeploy:
      type: object
      required:
        - type
        - cluster
        - plan_id
        - image
        - mounts
        - peers
        - access_key
        - secret_key
      properties:
        type:
          type: string
          const: storage_deploy
        cluster:
          type: string
        plan_id:
          type: string
        image:
          type: string
          description: 固定 release 标签，不接受 latest。
        mounts:
          type: array
          items:
            type: string
          description: 本节点参与集群的挂载点。
        peers:
          type: array
          items:
            type: string
          description: 集群全部节点地址（含本机）。
        access_key:
          type: string
          description: 访问凭据的键名。凭据本身由 Agent 本地保存，不经过网络。
        secret_key:
          type: string
      additionalProperties: false
    ActionStorageStatus:
      type: object
      required:
        - type
        - cluster
      properties:
        type:
          type: string
          const: storage_status
        cluster:
          type: string
      additionalProperties: false
    ActionStorageBucket:
      type: object
      required:
        - type
        - cluster
        - bucket
      properties:
        type:
          type: string
          const: storage_bucket
        cluster:
          type: string
        bucket:
          type: string
        remove:
          type: boolean
          default: false
      additionalProperties: false
    ActionStorageUser:
      type: object
      required:
        - type
        - cluster
        - user
        - secret
      properties:
        type:
          type: string
          const: storage_user
        cluster:
          type: string
        user:
          type: string
        secret:
          type: string
        policy:
          type: string
          default: readwrite
        remove:
          type: boolean
          default: false
      additionalProperties: false
    TaskEnvelope:
      type: object
      required:
        - id
        - node_id
        - key
        - action
        - digest
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        node_id:
          type: string
          description: 目标节点编号。
        key:
          type: string
          description: 提交时的幂等键，与 node_id 组成唯一约束。
        action:
          $ref: "#/components/schemas/Action"
        digest:
          type: string
          description: 参数摘要（SHA-256）。相同节点与幂等键下摘要不同即视为冲突。
        status:
          $ref: "#/components/schemas/TaskStatus"
        sequence:
          type: integer
          format: int64
          description: 进度序号。新建为 0，Agent 每次上报递增。
        result:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 任务结果，任意 JSON 对象，可为 null（形状由具体操作决定）。
        error:
          type:
            - string
            - "null"
          description: 失败信息，可为 null。
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
      additionalProperties: false
