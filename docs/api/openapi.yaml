        - memory_used
        - memory_total
        - swap_used
        - load1
        - disk_read_bytes_per_second
        - disk_write_bytes_per_second
        - net_rx_bytes_per_second
        - net_tx_bytes_per_second
      properties:
        at:
          type: integer
          format: int64
          description: 时间戳（Unix 秒），取所在步长桶内**首条采样**自己的时间戳，不与桶边界对齐。
        cpu_usage:
          type: number
          description: CPU 使用百分比。
        memory_used:
          type: integer
          format: int64
          description: 已用内存字节。
        memory_total:
          type: integer
          format: int64
          description: 内存总量字节。
        swap_used:
          type: integer
          format: int64
          description: 已用交换分区字节。
        load1:
          type: number
          description: 1 分钟平均负载。
        disk_read_bytes_per_second:
          type: number
          description: 磁盘读速率（字节/秒）。
        disk_write_bytes_per_second:
          type: number
          description: 磁盘写速率（字节/秒）。
        net_rx_bytes_per_second:
          type: number
          description: 入站速率（字节/秒），各网卡求和。
        net_tx_bytes_per_second:
          type: number
          description: 出站速率（字节/秒），各网卡求和。
      additionalProperties: false
    ShareSummary:
