      description: |
        返回分享页 HTML（text/html; charset=utf-8）。启用了包级分享主题时返回主题入口 HTML 并带独立 CSP 头，
        否则回落内置 share.html。只读，不写库、不广播、不产生任务；不设置缓存响应头。
        带结尾斜杠的 /share/{token}/ 是分享面入口；不带斜杠的 /share/{token} 会先被 301 永久重定向到此处。
        令牌无效时门禁直接丢弃连接、没有常规 HTTP 响应，因此不会出现 401 或 404 JSON。
      servers:
        - url: https://{host}
          description: 主控 HTTPS 监听地址
          variables:
            host:
              default: localhost:65535
              description: 主控 HTTPS 监听地址
      security: []
      responses:
        "200":
          description: 分享页 HTML 正文。
          content:
            text/html:
              schema:
                type: string
        "404":
          description: |
            纯文本「分享页尚未构建」（无 JSON error 包装）：读取 s.web/share.html 失败，即内置页未构建且未启用分享主题。
            令牌无效时门禁会直接丢弃连接、没有常规 HTTP 响应，不会到达本处理函数。
          content:
            text/plain:
              schema:
                type: string
                const: 分享页尚未构建
