openapi: 3.1.0
info:
  title: opsd 控制台 HTTP API
  version: 1.0.0
  summary: 主控控制台的浏览器接口契约
  description: |
    本文档是 opsd 主控 HTTP 接口的**契约源文件**。`web/src/generated/api.ts` 由它生成，
    漂移检查会阻止生成物与它不一致；因此接口变更必须先改这里。

    ## 路径与安全入口

    控制台整体挂在 `/{安全入口}/` 之下，安全入口是路径第一段（16 位随机字符，可在设置页轮换）。
    因此下列 `/api/v1/...` 路径的**真实地址都带该前缀**，本文件通过 server 变量的形式表达，
    不在每条路径里重复。首段不匹配的请求由门禁直接断连，不产生 HTTP 响应。

    入口之外只有两个面：一次性注册（`/api/v1/enroll`，经白名单精确放行）与分享页（`/share/{token}/...`，
    凭各自令牌放行）。二者在对应操作上用 `servers` 覆盖。

    ## 认证

    会话 Cookie `opsd_session`（HttpOnly、Secure、SameSite=Strict、Path=/{安全入口}/、8 小时）配合
    CSRF 头 `x-csrf-token`。**非 GET/HEAD 请求**还必须满足 `Origin` 精确等于 `OPSD_ORIGIN`。

    - 未登录：`401` + `{"error":"请先登录"}`。
    - CSRF 或 Origin 失败：`403`，正文是**纯文本**，不是 JSON。
    - Cookie 的 Path 被限定在安全入口之下，浏览器不会把它发给分享面。

    ## 错误约定

    业务错误统一为 `{"error":"<中文消息>"}`；具体状态码与文案见各操作。注意三类例外：
    门禁的 `403` 是纯文本；控制台面的 `413`（请求体超过 1MB）由 `DefaultBodyLimit` 直接产生；
    **请求体的框架级拒绝**——JSON 语法错误、字段缺失或类型不符、未知字段、Content-Type 不对——在进入处理函数之前
    就由 axum 的 `Json` 提取器产生，正文是**纯文本**，不是 `{"error"}`。
    状态码：JSON 语法错误 → 400；可解析但无法反序列化（含 `deny_unknown_fields` 拒绝的未知字段）→ 422；
    Content-Type 不是 application/json → 415。各写操作列出的 `400` 只覆盖处理函数内部的校验失败。

    错误响应一律不含凭据、环境变量、SQL 正文与文件内容。

    ## 变更与幂等

    产生变更的操作都带 `task_id`，但状态码分两档：**只有节点操作
    `POST /api/v1/nodes/{id}/actions` 返回 `202`**；文件（`/nodes/{id}/files`）、主机盘点、
    数据库巡检、存储集群等其余变更接口都是 `200`。以各操作自身的响应表为准，不要按这一句推断。
    提交时提供 `idempotency_key`：同节点 + 同键 + 同参数摘要 → 返回已存在的任务（不重复执行）；
    同节点 + 同键 + **不同**参数摘要 → `400`「幂等键已用于不同参数」。这是 `400` 而不是 `409`。

    ## 资源标识

    资源一律用 `node_id + resource_id` 定位，不存在跨节点按名称操作。`node_id` 是路径参数 `{id}`。

    ## 不在本文档范围内

    以下端点存在，但不是浏览器/机器 HTTP 契约，刻意不收录（不要据此认为它们不存在）：
    `GET /agent` 是 Agent 的常驻 WebSocket 通道，其内部协议与本文档分离，只要求协议版本、目标节点与身份绑定；
    `GET /api/v1/health` 是只绑定回环的运维健康检查，不经安全入口，返回 `{"status":"ok"}`；
    `GET /{安全入口}` → 301 跳转到 `/{安全入口}/`，是静态入口重定向而不是接口。
servers:
  - url: https://{host}/{entrance}
    description: 控制台面。分享面与注册不在这个 server 下。
    variables:
      host:
        default: localhost:65535
        description: 主控 HTTPS 监听地址（OPSD_ORIGIN 的 host 部分）
      entrance:
        default: 安全入口占位
        description: 16 位安全入口路径段，改后旧地址立即失效
  - url: https://{host}
    description: 入口之外的公开面：一次性注册与分享页。
    variables:
      host:
        default: localhost:65535
        description: 主控 HTTPS 监听地址
tags:
  - name: auth
    description: 会话
  - name: nodes
    description: 节点目录
  - name: tasks
    description: 任务与幂等
  - name: events
    description: 事件流
  - name: metrics
    description: 指标
  - name: agent
    description: Agent 注册与续期（mTLS，非浏览器接口）
  - name: share
    description: 分享页与公开数据
  - name: theme
    description: 主题
  - name: audit
    description: 审计
  - name: storage
    description: 存储与存储集群
  - name: database
    description: 数据库只读巡检
security:
  - sessionCookie: []
paths:
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: 管理员登录
      description: 入口之下但不需要会话。自身先做一次 Origin 校验，并按来源 IP 限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，同时下发 opsd_session Cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: |
            业务校验失败为 {"error":"<中文消息>"}（见 BadRequest）；
            请求体不是 JSON / 含未知字段 / 类型不符时为框架纯文本（见 BadRequest 的 text/plain 侧与 415/422）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          description: 密码错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Origin 不匹配，返回 {"error":"请求来源不匹配"}。这是登录自身的校验，早于其他检查。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          description: 登录过于频繁或来源过多。正文为「登录尝试过于频繁」或「请稍后重试」。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: 退出登录
      security:
        - sessionCookie: []
          csrfToken: []
      description: 删除服务端会话并清除 Cookie。无请求体。
      responses:
        "200":
          description: 已退出。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: 读取当前会话
      description: GET 不做 CSRF/Origin 校验，只校验会话存在。
      responses:
        "200":
          description: 当前会话。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes:
    get:
      tags:
        - nodes
      summary: 节点列表
      description: 返回全部节点（含已撤销）及其在线判定。在线判定由 last_seen 与在线通道共同决定，不在 Node 结构体内。
      responses:
        "200":
          description: 节点条目数组。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    put:
      tags:
        - nodes
      summary: 更新节点
      security:
        - sessionCookie: []
          csrfToken: []
      description: 更新节点登记信息，随后向未撤销节点重新下发地址与探测目标任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: 更新后的节点。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          description: 业务校验失败 {"error"}；JSON 语法错误为框架纯文本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags:
        - nodes
      summary: 撤销节点
      security:
        - sessionCookie: []
          csrfToken: []
      description: 置 revoked=true 并断开在线通道，不物理删除记录。
      responses:
        "200":
          description: 已撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
  /api/v1/enrollment-tokens:
    post:
      tags:
        - nodes
      summary: 签发一次性注册令牌
      security:
        - sessionCookie: []
          csrfToken: []
      description: 令牌 600 秒内有效、一次性使用，绑定到新生成的 node_id。每次调用都新建令牌，不参与幂等。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: 令牌与 CA 指纹。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentToken"
        "400":
          description: 业务校验失败 {"error"}；JSON 语法错误为框架纯文本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/peer-addresses:
    get:
      tags:
        - nodes
      summary: 读取节点地址集合
      description: |
        未撤销节点的去重排序公网地址集合，带版本号。
        该记录由后台对账任务写入（60 秒周期，失败只记日志）。
        **全新控制库在首次对账成功前返回 200 + {version: 0, addresses: []}**，不是 null、也不是 404。
      responses:
        "200":
          description: 地址集合；尚未写入过时为 version 0 与空数组。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerAddressSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      tags:
        - tasks
      summary: 提交节点操作
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        所有节点变更的统一入口。提交前校验幂等键长度、节点存在/未撤销/在线，
        并拒绝外部提交 peer_sync（地址集合只能由节点目录生成）。
        返回 202 与 task_id；任务由调度循环投递给节点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Submit"
      responses:
        "202":
          description: 已受理。重放相同幂等键与相同参数时返回同一 task_id。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          description: |
            参数或状态不满足：幂等键长度无效、节点不可用、节点离线、地址集合只能由节点目录生成、
            验证节点必须是另一个在线节点、幂等键已用于不同参数。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/nodes/{id}/files:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      tags:
        - tasks
      summary: 提交结构化文件操作
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        只接受 put / remove / rename / mkdir / chmod / chown 六类结构化操作，不接受任意命令。
        注意与 actions 的差异：本端点**不校验节点是否存在或在线**，节点不存在也会落库为待投递任务；
        成功返回 200（不是 202），并写审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileSubmit"
      responses:
        "200":
          description: 已受理。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          description: 业务校验失败 {"error"}；JSON 语法错误为框架纯文本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tasks:
    get:
      tags:
        - tasks
      summary: 任务列表
      description: 按创建时间倒序。参数正文中的 StackCreate / StackPlan 配置正文已被替换为「[配置正文已隐藏]」。
      responses:
        "200":
          description: 任务数组。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags:
        - tasks
      summary: 任务详情
      responses:
        "200":
          description: 任务。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvelope"
        "400":
          description: 查无此任务时也返回 400「任务不存在」，历史原因不是 404。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tasks/{id}/events:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags:
        - tasks
      summary: 任务事件
      description: 按事件序号升序返回，无分页、无数量上限；任务不存在时返回空数组。
      responses:
        "200":
          description: 事件数组。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/events:
    get:
      tags:
        - events
      summary: 控制台事件流
      description: |
        SSE 流（text/event-stream）。每帧 data 是一个带 type 判别字段的 JSON 对象：
        tasks / nodes / metrics / storage / database / task（带完整任务对象）/ resync（订阅滞后时提示重新拉取）。
        没有重连补传机制：断线期间的事件不会补发，客户端必须重新拉取状态。
      responses:
        "200":
          description: SSE 流。流在会话过期时长后由服务端关闭。
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConsoleEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/audit:
    get:
      tags:
        - audit
      summary: 查询审计记录
      description: 审计只记元数据，detail 依约定不含凭据、环境变量、SQL 正文与文件内容。
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 时间下界（Unix 秒），at >= from
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 时间上界（Unix 秒），at <= to
        - name: node
          in: query
          required: false
          schema:
            type: string
          description: 按 node_id 精确筛选
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: 按类别精确筛选
        - name: result
          in: query
          required: false
          schema:
            type: string
          description: 按结果精确筛选
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: 返回条数上限，默认 200，硬上限 1000
      responses:
        "200":
          description: 审计记录与保留期。
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                  - retention_seconds
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditRecord"
                  retention_seconds:
                    type: integer
                    description: 审计保留时长，恒为 365 天秒数
                    const: 31536000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/settings/entrance:
    get:
      tags:
        - auth
      summary: 读取安全入口
      responses:
        "200":
          description: 当前安全入口；无记录时为空串。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntranceValue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    put:
      tags:
        - auth
      summary: 轮换安全入口
      security:
        - sessionCookie: []
          csrfToken: []
      description: 校验通过后立即生效，旧地址失效，用户需用新入口重新访问。新入口不写日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntranceValue"
      responses:
        "200":
          description: 生效后的入口与是否发生变化。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntranceUpdate"
        "400":
          description: 业务校验失败 {"error"}；JSON 语法错误为框架纯文本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/enroll:
    post:
      tags:
        - agent
      summary: Agent 一次性注册
      description: |
        入口之外的白名单路径，凭一次性令牌放行，不依赖会话。Agent 在拿到客户端证书之前调用。
        成功后令牌立即失效（防重放），并签发 90 天客户端证书。
      servers:
        - url: https://{host}
          variables:
            host:
              default: localhost:65535
              description: 主控 HTTPS 监听地址
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: 节点编号与客户端证书。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          description: 令牌已被使用、CSR 签名失败或 CA 文件缺失。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
