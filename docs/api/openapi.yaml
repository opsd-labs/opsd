          $ref: "#/components/schemas/DockerOperation"
      additionalProperties: false
    ActionPullImage:
      type: object
      required:
        - type
        - reference
      properties:
        type:
          type: string
          const: pull_image
        reference:
          type: string
      additionalProperties: false
    ActionStackImport:
      type: object
