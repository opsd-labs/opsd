  /api/v1/themes:
    get:
      tags:
        - theme
      summary: 列出已安装主题
      description: 返回全部已安装主题（含配置项声明），按 short 字典序排列；启用状态见 /api/v1/themes/active。
      responses:
        "200":
          description: 已安装主题列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/themes/active:
    get:
      tags:
        - theme
      summary: 读取两个界面的启用主题
      description: 返回控制台与分享页当前启用主题的 describe 输出；未启用时回落到内置主题形态。
      responses:
        "200":
          description: 两个界面各自的启用主题描述。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    put:
      tags:
        - theme
      summary: 切换启用主题
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        按界面写入启用记录与设置；short 为 default（大小写不敏感）时清除启用记录回到内置主题。
        无幂等键要求，重复提交以新值覆盖；设置合并声明默认值后编码为 JSON 字符串的长度不得超过
        MAX_SETTINGS_BYTES（32 KiB）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeActivateRequest"
      responses:
        "200":
          description: 已生效的主题与设置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeActivateResult"
        "400":
          description: |
            surface 不是 console 或 share（「未知界面：<x>」）；short 非 default 且未安装（「主题未安装」）；
            主题未声明覆盖目标界面（「该主题未声明支持这个界面」）；合并默认值后的设置编码超过
            MAX_SETTINGS_BYTES（32 KiB，「主题设置体积过大」）。这是 400 而不是 404。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/themes/console:
    post:
      tags:
        - theme
      summary: 安装控制台主题（令牌级）
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        清单直接以 JSON 提交，不携带资源文件；校验通过后入库，digest 为主控对序列化清单计算的 sha256。
        short 相同时覆盖既有记录（无幂等键）。short 只能含大小写字母/数字/下划线/连字符（1-48 字符），
        不得为 default（大小写不敏感）。整个路由处于控制台面默认 1 MiB 请求体上限之下。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeManifest"
      responses:
        "200":
          description: 已安装的主题 short。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeInstallConsoleResult"
        "400":
          description: |
            清单校验失败（short 为空/超 48 字符/含非法字符/为 default、surfaces 为空、控制台主题缺
            tokens、令牌名不以 -- 开头或令牌值含不允许的字符与写法、configuration.type 非 managed、
            配置项 key 或类型非法，正文为具体校验消息）；或清单未声明支持控制台
            （「该主题未声明支持控制台」）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/themes/share:
    post:
      tags:
        - theme
      summary: 安装分享页主题包（zip 原始字节）
      security:
        - sessionCookie: []
          csrfToken: []
      description: |
        请求体为主题包 zip 的原始字节，非 multipart，也不解析 Content-Type，直接读字节流；
        包根目录必须含 theme.json 与 index.html。先解压到临时目录、校验通过后再就位，
        同 short 覆盖旧记录与资源目录（无幂等键）。包体积上限 MAX_PACKAGE_BYTES（20 MiB），
        解压后总量上限 MAX_EXTRACTED_BYTES（64 MiB，防解压炸弹）。
      requestBody:
        required: true
        description: 主题包 zip 的原始字节。
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 已安装的主题 short 与内容摘要。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeInstallShareResult"
        "400":
          description: |
            请求体为空（「请求体为空」）、主题包不是有效的 zip（「主题包不是有效的 zip」）、根目录缺
            theme.json、theme.json 解析失败、清单校验失败、清单未声明支持分享页、根目录缺 index.html、
            包内越界路径、解压后总大小超 64 MiB 上限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginOrCsrfRejected"
        "413":
          description: 请求体超过 MAX_PACKAGE_BYTES（20 MiB），由路由层 DefaultBodyLimit 在进入处理函数前拒绝；正文是 axum 默认纯文本，不是本模块的 JSON 错误体。
          content:
            text/plain:
              schema:
                type: string
                const: Failed to buffer the request body
  /api/v1/themes/{short}:
    parameters:
      - name: short
        in: path
        required: true
        schema:
          type: string
        description: 主题唯一标识，仅大小写字母/数字/下划线/连字符，长度 1-48；default 保留给内置主题。
    delete:
      tags:
        - theme
      summary: 删除主题
      security:
        - sessionCookie: []
