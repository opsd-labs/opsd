  (()=>{
    'use strict';

    const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=(name,extra='')=>`<svg aria-hidden="true" ${extra}><use href="#i-${name}"></use></svg>`;
    const palettes=[
      {id:'bluegreen',name:'蓝青',note:'清楚而克制',light:'#0D5661',dark:'#69B0AC'},
      {id:'green',name:'木贼灰绿',note:'微暖、稳重',light:'#2D6D4B',dark:'#86A697'},
      {id:'blue',name:'Coolors 蓝灰',note:'清冷、明晰',light:'#3D669D',dark:'#A1C6EA'},
      {id:'navy',name:'靛蓝',note:'深沉、收敛',light:'#0F2540',dark:'#9BB5D6'},
      {id:'wisteria',name:'藤灰',note:'柔和的灰紫',light:'#5F6692',dark:'#B0ADD5'},
      {id:'copper',name:'赤铜',note:'温暖、沉静',light:'#9A5034',dark:'#D8A48B'},
      {id:'graphite',name:'暖石墨',note:'中性、低干扰',light:'#434343',dark:'#C8CECA'},
      {id:'olive',name:'橄榄',note:'自然、朴素',light:'#616138',dark:'#B4BA8F'}
    ];
    const layouts=[['continuous','连续工作面'],['top','顶部导航'],['split','并排检查']];
    const scenes=[['nodes','节点','node'],['docker','Docker','docker'],['firewall','防火墙','shield']];
    const cases=[['normal','正常'],['offline','离线'],['external','外部维护'],['conflict','配置冲突'],['error','读取失败']];
    const defaults={palette:'navy',layout:'continuous',mode:'dark',scene:'firewall',node:'C052',case:'normal',gallery:false,fullscreen:false,inspector:false,queries:{},filters:{direction:'',action:''},tabs:{firewall:'rules',docker:'containers'},pages:{},pageSize:50,selected:{},log:null};
    let state=JSON.parse(JSON.stringify(defaults)),ruleEdits={},containerChanges={},configEdits={},localEvents=[],feedbackTimer,modalOrigin=null,inspectorOrigin=null,dialogContext=null,menuOrigin=null,restoredLayout='';
    try{const saved=JSON.parse(localStorage.getItem('opsd.design-study.v1')||'null');if(saved&&typeof saved==='object'){restoredLayout=saved.layout;for(const key of ['palette','layout','mode','scene','node','case','inspector'])if(key in saved)state[key]=saved[key];for(const key of ['queries','filters','tabs','pages','selected'])if(saved[key]&&typeof saved[key]==='object'&&!Array.isArray(saved[key]))state[key]={...state[key],...saved[key]};if([25,50,100].includes(saved.pageSize))state.pageSize=saved.pageSize;}}
    catch{/* 禁用本地存储时仍可使用全部演示功能。 */}
    const hash=new URLSearchParams(location.hash.slice(1));for(const key of ['palette','layout','mode','scene','node','case'])if(hash.has(key))state[key]=hash.get(key);state.fullscreen=hash.get('preview')==='1';state.gallery=hash.get('gallery')==='1';
    const sourceNodes=[
      ['C001','美国','Pmail、MariaDB Galera、OpenResty','nftables'],['C011','台湾','Sub2API、PostgreSQL、Redis、Pocket ID','ufw'],['C021','香港','EasyTier、GOST、OpenResty','iptables-nft'],['C041','美国','OpenList、Nowen Note、图床、MariaDB Galera','nftables'],['C051','广州','FRP Panel、SillyTavern、Homepage','firewalld'],['C052','日本','Vaultwarden、SearXNG、AstrBot、AIClient2API','ufw'],['C061','广州','Gotify、FRPS、OpenResty','ufw'],['C062','深圳','NapCat、FRP Panel、OpenResty','iptables-nft'],['C071','美国','Komari、MariaDB Galera、HAProxy','nftables'],['C081','新加坡','图片渲染、OpenResty、GOST','ufw'],['C091','日本','Forgejo、OpenList、MariaDB Galera','nftables'],['C101','香港','New API、EasyTier Web、MariaDB Galera','firewalld']
    ];
    const nodes=sourceNodes.map(([id,area,business,backend],i)=>({id,area,name:`${id} · ${area}`,business,backend,online:id!=='C061',owner:id==='C001'?'外部维护':'opsd',version:id==='C061'?10:12,public4:`203.0.113.${i+11}`,public6:`2001:db8:1234:5678:abcd:ef01:2345:${(i+11).toString(16)}`,overlay:`100.100.201.${Number(id.slice(1))}`,count:2+(i%4),ssh:id==='C071'?65522:22,collected:'14:32:08'}));
    function valid(value,options,fallback){return options.includes(value)?value:fallback;}
    state.palette=valid(state.palette,palettes.map(p=>p.id),defaults.palette);state.layout=valid(state.layout,layouts.map(p=>p[0]),defaults.layout);state.mode=valid(state.mode,['dark','light'],'dark');state.scene=valid(state.scene,scenes.map(p=>p[0]),'firewall');state.node=valid(state.node,['all',...nodes.map(n=>n.id)],'C052');state.case=valid(state.case,cases.map(p=>p[0]),'normal');state.tabs.firewall=valid(state.tabs.firewall,['rules','peers','history'],'rules');state.tabs.docker=valid(state.tabs.docker,['containers','stacks'],'containers');

    function statusBadge(text,tone='',mark='unknown'){
  const marks={active:'<circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/>',paused:'<path d="M5.5 4v8M10.5 4v8"/>',pending:'<circle cx="8" cy="8" r="6"/><path d="M8 4.5v4M8 11.5h.01"/>',failed:'<circle cx="8" cy="8" r="6"/><path d="m6 6 4 4m0-4-4 4"/>',unknown:'<circle cx="8" cy="8" r="4.5"/>',neutral:'<path d="M4 8h8"/>'};

    function nodeIsOffline(n){return currentCase()==='offline'||n?.online===false;}
    function resultStatus(result){
  const values={'已验证':['good','active'],'无冲突':['good','active'],'已同步':['good','active'],'待同步':['warn','pending'],'失败':['bad','failed'],'读取失败':['bad','failed'],'回滚失败':['bad','failed'],'冲突':['bad','failed'],'只读发现':['','neutral'],'仅本地修改':['','neutral']};
  return statusBadge(result||'未知',...(values[result]||['','unknown']));
}
    function resourceStatus(r,kind){
  const n=nodes.find(n=>n.id===(r.nodeId||r.id)),offline=nodeIsOffline(n);
  if(kind==='result')return resultStatus(r.result);
  if(kind==='connection')return currentCase()==='error'?statusBadge('未知'):offline?statusBadge('离线','warn','pending'):r.online===true?statusBadge('在线','good','active'):statusBadge('未知');
  if(kind==='peer')return offline?statusBadge('离线 · 待同步','warn','pending'):r.actual==null||r.desired==null?statusBadge('未知'):r.actual===r.desired?statusBadge('已同步','good','active'):statusBadge('待同步','warn','pending');
  if(offline)return statusBadge('离线快照','warn','pending');
  if(kind==='stack')return statusBadge('已发现','','neutral');
  if(kind==='rule'&&currentCase()==='conflict')return statusBadge('配置冲突','bad','failed');
  const enabled=kind==='rule'?r.enabled:r.running;
  return enabled===true?statusBadge(kind==='rule'?'启用':'运行中','good','active'):enabled===false?statusBadge(kind==='rule'?'停用':'已停止','','paused'):statusBadge('未知');
}
    function affiliation(text){return `<span class="affiliation">${esc(text)}</span>`;}

    function openRule(r){if(!isWritable(r))return notify('此资源当前只读，可在异常场景中切换至正常样例。');const data=r||{id:`${state.node}:rule:new-${Date.now()}`,nodeId:state.node,name:'新增访问规则',source:'198.51.100.10/32',target:'本机',family:4,direction:'入站',protocol:'tcp',ports:'443',action:'允许',owner:'opsd',enabled:true,order:Math.max(...rulesFor(node()).map(x=>x.order))+1};dialogContext={type:'rule',row:data,isNew:!r||!!r.isNew};openDialog(r?'编辑规则样例':'新建规则样例',`${node().name} · 仅修改本地演示数据`,`<form id="rule-form"><div class="form-grid"><div class="field full"><label for="rule-name">规则名称</label><input id="rule-name" name="name" required maxlength="80" value="${esc(data.name)}"></div><div class="field"><label for="rule-family">地址族</label><select id="rule-family" name="family">${[4,6].map(v=>option(v,`IPv${v}`,data.family)).join('')}</select></div><div class="field"><label for="rule-direction">方向</label><select id="rule-direction" name="direction">${['入站','出站','转发'].map(v=>option(v,v,data.direction)).join('')}</select></div><div class="field full"><label for="rule-source">来源地址 / CIDR</label><input id="rule-source" name="source" spellcheck="false" value="${esc(data.source)}" required></div><div class="field full"><label for="rule-target">目标</label><input id="rule-target" name="target" value="${esc(data.target)}" required></div><div class="field"><label for="rule-protocol">协议</label><select id="rule-protocol" name="protocol">${['tcp','udp','any'].map(v=>option(v,v==='any'?'全部':v.toUpperCase(),data.protocol)).join('')}</select></div><div class="field"><label for="rule-ports">端口 / 范围</label><input id="rule-ports" name="ports" value="${esc(data.ports)}" required placeholder="443 或 8000–8010"></div><div class="field"><label for="rule-action">匹配动作</label><select id="rule-action" name="action">${['允许','丢弃','拒绝'].map(v=>option(v,v,data.action)).join('')}</select></div><div class="field"><label>启停状态</label><label class="check-label"><input type="checkbox" name="enabled" ${data.enabled?'checked':''}>启用规则</label></div></div><div id="rule-error" class="form-error hidden" role="alert"></div><p class="form-note">保存仅更新这个参考页面。示例不校验完整防火墙语义，也不会发布规则。</p></form>`,button('close-dialog','取消')+'<button class="btn primary" form="rule-form" type="submit">保存本地样例</button>');}
    function openCompose(r){if(!r?.project)return;if(!isWritable(r))return notify('外部配置保持只读，切换正常场景可查看编辑样例。');dialogContext={type:'compose',row:r,before:configEdits[`${r.nodeId}:${r.project}`]||composeText(r)};openDialog('编辑配置样例',`${r.nodeId} / ${r.project} · 原目录 ${r.directory}`,`<form id="compose-form"><div class="field"><label for="compose-source">Compose 配置文本</label><textarea class="code" id="compose-source" name="content" rows="14" maxlength="24000" required spellcheck="false">${esc(configEdits[`${r.nodeId}:${r.project}`]||composeText(r,true))}</textarea></div><p class="form-note">下一步展示文本差异。命名卷和宿主机目录不会执行任何操作。</p></form>`,button('close-dialog','取消')+'<button class="btn primary" form="compose-form" type="submit">查看本地差异</button>',true);}
    function diffLines(before,after){const a=before.split('\n'),b=after.split('\n');if(a.length>300||b.length>300)return {a:a.map(s=>[s,'removed']),b:b.map(s=>[s,'added'])};const d=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)d[i][j]=a[i]===b[j]?1+d[i+1][j+1]:Math.max(d[i+1][j],d[i][j+1]);let i=0,j=0,outA=[],outB=[];while(i<a.length||j<b.length){if(i<a.length&&j<b.length&&a[i]===b[j]){outA.push([a[i++],'']);outB.push([b[j++],'']);}else if(j<b.length&&(i===a.length||d[i][j+1]>=d[i+1][j]))outB.push([b[j++],'added']);else outA.push([a[i++],'removed']);}return {a:outA,b:outB};}
    function openDiff(before,after,title,subtitle,context){dialogContext=context;const diff=diffLines(before,after),renderLines=lines=>lines.map(([s,c])=>`<span class="${c}">${esc(s)||' '}</span>`).join('');openDialog(title,subtitle,`<div class="diff-summary"><span>节点与资源保持绑定</span><span>新增 ${diff.b.filter(x=>x[1]).length} 行</span><span>移除 ${diff.a.filter(x=>x[1]).length} 行</span></div><div class="diff-columns"><section class="diff-side"><div class="diff-title">当前示例</div><pre class="diff-code" tabindex="0" aria-label="配置差异文本，可滚动">${renderLines(diff.a)}</pre></section><section class="diff-side"><div class="diff-title">修改后示例</div><pre class="diff-code" tabindex="0" aria-label="配置差异文本，可滚动">${renderLines(diff.b)}</pre></section></div><p class="form-note">这是本地文本比较，未进行系统执行或运行状态验证。</p>`,button('close-dialog','关闭')+(context?.type==='apply-compose'?'<button class="btn primary" data-action="apply-compose">采用本地示例</button>':''),true);}
    // 菜单位于浏览器顶层，避免被表格滚动区裁切；所有目标仍使用节点与资源联合标识。
    function closeMenu(restore=true){

      menuOrigin={action:'row-menu',row:row.id};
      const item=(action,label,ico,disabled=false)=>`<button class="menu-item" type="button" role="menuitem" tabindex="-1" data-action="${action}" ${rowExtra(row)} ${disabled?'disabled':''}>${icon(ico)}<span>${esc(label)}</span></button>`;
      menu.innerHTML=`<div class="menu-heading" role="presentation"><strong>${esc(row.name)}</strong>${esc(target.name)}${readOnly?` · ${!target.online?'离线':row.owner!=='opsd'?row.owner:cases.find(c=>c[0]===currentCase())?.[1]||'只读'}`:''}</div>${item('select','查看详情','panel')}${item('logs','查看日志','terminal')}${state.tabs.docker==='containers'?item('toggle-container',row.running?'停止本地示例':'启动本地示例',row.running?'pause':'play',readOnly):''}${item('compose','编辑配置样例','file',readOnly)}`;
      trigger.setAttribute('aria-expanded','true');menu.showPopover();

      menu.style.left=Math.max(8,Math.min(rect.right-width,innerWidth-width-8))+'px';

      const items=Array.from(menu.querySelectorAll('[role="menuitem"]:not(:disabled)'));(last?items.at(-1):items[0])?.focus();

    function menuKeyboard(e){
      const trigger=e.target.closest('[data-action="row-menu"]');
      if(trigger&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openMenu(trigger,e.key==='ArrowUp');return true;}
      if(!$('#resource-menu').matches(':popover-open'))return false;
      if(e.key==='Escape'){e.preventDefault();closeMenu();return true;}
      if(e.key==='Tab'){closeMenu();return false;}
      if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
        e.preventDefault();const items=Array.from($('#resource-menu').querySelectorAll('[role="menuitem"]:not(:disabled)')),i=items.indexOf(e.target);
        const next=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
        items[next]?.focus();return true;
      }
      return false;
    }

    }
    $('#resource-menu').addEventListener('toggle',()=>{if(!$('#resource-menu').matches(':popover-open'))document.querySelector('[data-action="row-menu"][aria-expanded="true"]')?.setAttribute('aria-expanded','false');});

    document.addEventListener('change',e=>{const k=e.target.dataset.change;if(!k)return;const v=e.target.value;if(k==='direction'||k==='action'){state.filters[k]=v;state.pages[resourceKey()]=1;}else if(k==='pageSize'){state.pageSize=Number(v);state.pages[resourceKey()]=1;}else if(k==='layout'){state.layout=v;state.inspector=v==='split'||state.inspector;}else if(k==='scene'){state.scene=v;state.gallery=false;}else if(k==='node'){state.node=v;state.pages[resourceKey()]=1;}else state[k]=v;render();});
